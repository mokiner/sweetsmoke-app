<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetSmoke Borisov</title>
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS для стилизации -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Кастомный дизайн в стиле Toxic Monster Energy / Y2K */
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    .neon-text {
      color: #39FF14;
      text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
    }

    .neon-border {
      border: 2px solid #39FF14;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
    }

    .card-bg {
      background: linear-gradient(145deg, #181818, #101010);
      border: 1px solid #282828;
    }

    .category-card {
      border: 2px solid #FF8C00;
      border-radius: 1rem;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .category-card:active {
      transform: scale(0.97);
    }

    /* Фоновый узор Monster/Toxic */
    .toxic-bg-overlay {
      background-image: radial-gradient(#1e3b08 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 0.25;
    }
  </style>
</head>
<body class="pb-24">
  <div class="fixed inset-0 toxic-bg-overlay pointer-events-none z-0"></div>

  <!-- Шапка -->
  <header class="relative z-10 flex items-center justify-between p-4 bg-black/80 backdrop-blur border-b border-zinc-800">
    <div>
      <h1 class="text-xl font-extrabold tracking-wider text-green-500 uppercase">SweetSmoke</h1>
      <p class="text-xs text-zinc-400">мини-приложение</p>
    </div>
    <button onclick="toggleAdminModal()" class="flex items-center gap-1 text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-full border border-zinc-700">
      ⚙ <span>Управление</span>
    </button>
  </header>

  <!-- Строка поиска -->
  <div class="relative z-10 px-4 mt-3">
    <div class="relative">
      <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Найти..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-2 px-10 text-sm focus:outline-none focus:border-green-500 text-zinc-200">
      <span class="absolute left-3 top-2.5 text-zinc-500 text-sm">🔍</span>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕНТ (Переключаемые экраны) -->
  <main id="appContent" class="relative z-10 p-4">
    <!-- 1. Главный каталог (Категории) -->
    <div id="viewCategories" class="space-y-4">
      <h2 class="text-lg font-bold text-zinc-200 mb-2">Каталог</h2>
      <div class="grid grid-cols-2 gap-4" id="categoriesGrid"></div>
    </div>

    <!-- 2. Список товаров категории -->
    <div id="viewProducts" class="hidden space-y-4">
      <button onclick="showCategories()" class="text-sm text-green-400 flex items-center gap-1 font-semibold mb-2">
        ‹ Назад в каталог
      </button>
      <h2 id="categoryTitle" class="text-lg font-bold text-zinc-200"></h2>
      <div class="grid grid-cols-2 gap-4" id="productsGrid"></div>
    </div>

    <!-- 3. Страница товара -->
    <div id="viewProductDetail" class="hidden space-y-4">
      <button onclick="showProductsCurrentCategory()" class="text-sm text-green-400 flex items-center gap-1 font-semibold">
        ‹ Назад к товарам
      </button>
      <div id="productDetailContainer"></div>
    </div>

    <!-- 4. Корзина -->
    <div id="viewCart" class="hidden space-y-4">
      <h2 class="text-xl font-extrabold text-green-500">Корзина</h2>
      <div id="cartItemsList" class="space-y-3"></div>
      <div id="cartSummary" class="border-t border-zinc-800 pt-4 space-y-2"></div>
    </div>

    <!-- 5. Оформление заказа -->
    <div id="viewCheckout" class="hidden space-y-4">
      <button onclick="showCart()" class="text-sm text-green-400 flex items-center gap-1 font-semibold">
        ‹ Назад в корзину
      </button>
      <h2 class="text-lg font-bold text-zinc-200">Оформление заказа</h2>
      
      <div class="flex gap-2 bg-zinc-900 p-1 rounded-xl border border-zinc-800 text-sm">
        <button id="btnDelivery" onclick="setOrderType('delivery')" class="flex-1 py-2 rounded-lg bg-green-500 font-bold text-black">🚗 Доставка</button>
        <button id="btnPickup" onclick="setOrderType('pickup')" class="flex-1 py-2 rounded-lg text-zinc-400">🏪 Самовывоз</button>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-3">
        <div id="addressField">
          <label class="text-xs text-zinc-400">Адрес доставки</label>
          <input type="text" id="custAddress" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm focus:border-green-500">
        </div>
        <div>
          <label class="text-xs text-zinc-400">Ваше Имя</label>
          <input type="text" id="custName" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm focus:border-green-500">
        </div>
        <div>
          <label class="text-xs text-zinc-400">Телефон</label>
          <input type="tel" id="custPhone" placeholder="+375..." required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm focus:border-green-500">
        </div>
        <div>
          <label class="text-xs text-zinc-400">Ник в Telegram</label>
          <input type="text" id="custTg" placeholder="@username" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm focus:border-green-500">
        </div>
        <div>
          <label class="text-xs text-zinc-400">Комментарий к заказу</label>
          <textarea id="custComment" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-sm focus:border-green-500 h-20"></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-green-500 text-black font-extrabold rounded-xl shadow-lg hover:bg-green-400 transition">
          Подтвердить и отправить заказ
        </button>
      </form>
    </div>
  </main>

  <!-- Навигация снизу -->
  <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-zinc-800 flex justify-around py-2 z-20">
    <button onclick="showCategories()" class="flex flex-col items-center text-xs text-green-500">
      <span class="text-base">📁</span>
      <span>Каталог</span>
    </button>
    <button onclick="showCart()" class="flex flex-col items-center text-xs text-zinc-400 relative">
      <span class="text-base">🛒</span>
      <span>Корзина</span>
      <span id="cartBadge" class="absolute -top-1 right-2 bg-green-500 text-black font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
    </button>
  </nav>

  <!-- Модальное окно Админ-Панели -->
  <div id="adminModal" class="fixed inset-0 bg-black/90 z-50 hidden p-4 overflow-y-auto">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold text-green-400">⚙ Админ-панель (Запасы)</h3>
      <button onclick="toggleAdminModal()" class="text-zinc-400 text-xl">✕</button>
    </div>
    <div id="adminStockList" class="space-y-3 text-sm"></div>
    <button onclick="addNewProductPrompt()" class="mt-4 w-full py-2 bg-zinc-800 text-green-400 border border-green-500/50 rounded-xl font-bold">
      + Добавить новый товар
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // База данных товаров (хранится в localStorage для редактирования)
    const defaultData = [
      { id: 1, category: 'Никобустеры', name: 'Никобустер 17-30 mg', price: 5, stock: 10, img: 'https://via.placeholder.com/150/111/00FF00?text=Nikobooster', desc: 'Усиленный никобустер премиум качества.' },
      { id: 2, category: 'POD - системы', name: 'XROS 3 Mini', price: 75, stock: 3, img: 'https://via.placeholder.com/150/111/00FF00?text=POD+System', desc: 'Компактная POD-система с отличной передачей вкуса.' },
      { id: 3, category: 'Жевательные смеси', name: 'Glitch (150 mg)', price: 13, stock: 2, img: 'https://via.placeholder.com/150/111/00FF00?text=Glitch+150mg', desc: 'Крепкая жевательная смесь.' },
      { id: 4, category: 'Картриджи', name: 'Vaporesso Xros 0.8 Om', price: 12, stock: 15, img: 'https://via.placeholder.com/150/111/00FF00?text=Cartridge', desc: 'Сменный картридж 0.8 Ом.' }
    ];

    let products = JSON.parse(localStorage.getItem('ss_products')) || defaultData;
    let cart = [];
    let currentCategory = '';
    let currentProduct = null;
    let orderType = 'delivery';

    function saveProducts() {
      localStorage.setItem('ss_products', JSON.stringify(products));
    }

    // Инициализация
    document.addEventListener("DOMContentLoaded", () => {
      renderCategories();
    });

    // Навигация по экранам
    function hideAllViews() {
      document.getElementById('viewCategories').classList.add('hidden');
      document.getElementById('viewProducts').classList.add('hidden');
      document.getElementById('viewProductDetail').classList.add('hidden');
      document.getElementById('viewCart').classList.add('hidden');
      document.getElementById('viewCheckout').classList.add('hidden');
    }

    function showCategories() {
      hideAllViews();
      document.getElementById('viewCategories').classList.remove('hidden');
      renderCategories();
    }

    function showProducts(category) {
      currentCategory = category;
      hideAllViews();
      document.getElementById('viewProducts').classList.remove('hidden');
      document.getElementById('categoryTitle').innerText = category;
      
      const grid = document.getElementById('productsGrid');
      const items = products.filter(p => p.category === category);

      grid.innerHTML = items.map(p => `
        <div onclick="showProductDetail(${p.id})" class="card-bg rounded-2xl p-3 flex flex-col justify-between cursor-pointer border border-zinc-800 hover:border-green-500/50">
          <img src="${p.img}" class="w-full h-28 object-cover rounded-xl mb-2">
          <h3 class="font-bold text-xs text-zinc-100 line-clamp-2">${p.name}</h3>
          <div class="mt-2 flex justify-between items-center">
            <span class="text-xs font-semibold ${p.stock > 0 ? 'text-green-400' : 'text-red-500'}">
              ${p.stock > 0 ? `В наличии: ${p.stock}` : 'Нет в наличии'}
            </span>
            <span class="font-extrabold text-sm text-green-400">${p.price} Br</span>
          </div>
        </div>
      `).join('');
    }

    function showProductsCurrentCategory() {
      if (currentCategory) showProducts(currentCategory);
      else showCategories();
    }

    function showProductDetail(id) {
      currentProduct = products.find(p => p.id === id);
      if (!currentProduct) return;

      hideAllViews();
      document.getElementById('viewProductDetail').classList.remove('hidden');
      
      const container = document.getElementById('productDetailContainer');
      const canBuy = currentProduct.stock > 0;

      container.innerHTML = `
        <div class="card-bg rounded-2xl p-4 space-y-3">
          <img src="${currentProduct.img}" class="w-full h-56 object-cover rounded-xl">
          <h2 class="text-lg font-bold text-white">${currentProduct.name}</h2>
          <p class="text-xs text-zinc-400">${currentProduct.desc}</p>
          <div class="flex justify-between items-center border-t border-zinc-800 pt-3">
            <span class="text-sm ${canBuy ? 'text-green-400' : 'text-red-500'}">
              ${canBuy ? `Остаток: ${currentProduct.stock} шт.` : 'Товар закончился'}
            </span>
            <span class="text-xl font-extrabold text-green-500">${currentProduct.price} Br</span>
          </div>
          <button onclick="addToCart(${currentProduct.id})" ${!canBuy ? 'disabled' : ''} 
            class="w-full py-3 rounded-xl font-bold transition ${canBuy ? 'bg-green-500 text-black hover:bg-green-400' : 'bg-zinc-800 text-zinc-600 cursor-not-allowed'}">
            ${canBuy ? 'Добавить в корзину' : 'Нет на складе'}
          </button>
        </div>
      `;
    }

    // Логика Категорий
    function renderCategories() {
      const categories = [...new Set(products.map(p => p.category))];
      const grid = document.getElementById('categoriesGrid');
      grid.innerHTML = categories.map(cat => `
        <div onclick="showProducts('${cat}')" class="category-card bg-zinc-900 p-4 text-center cursor-pointer">
          <h3 class="font-extrabold text-sm text-amber-400 uppercase tracking-wider">${cat}</h3>
        </div>
      `).join('');
    }

    // Корзина и ограничения
    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      if (!prod || prod.stock <= 0) return;

      const inCart = cart.find(c => c.id === id);
      const currentCartCount = inCart ? inCart.count : 0;

      if (currentCartCount + 1 > prod.stock) {
        alert(`Нельзя заказать больше! В наличии всего: ${prod.stock} шт.`);
        return;
      }

      if (inCart) {
        inCart.count++;
      } else {
        cart.push({ id: prod.id, name: prod.name, price: prod.price, count: 1, maxStock: prod.stock });
      }

      updateCartBadge();
      alert('Товар добавлен в корзину!');
    }

    function updateCartBadge() {
      const total = cart.reduce((acc, item) => acc + item.count, 0);
      const badge = document.getElementById('cartBadge');
      if (total > 0) {
        badge.innerText = total;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function showCart() {
      hideAllViews();
      document.getElementById('viewCart').classList.remove('hidden');
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cartItemsList');
      const summary = document.getElementById('cartSummary');

      if (cart.length === 0) {
        list.innerHTML = `<p class="text-zinc-500 text-sm text-center py-8">Ваша корзина пуста</p>`;
        summary.innerHTML = '';
        return;
      }

      list.innerHTML = cart.map(item => `
        <div class="card-bg p-3 rounded-xl flex items-center justify-between">
          <div>
            <h4 class="font-bold text-sm text-zinc-200">${item.name}</h4>
            <p class="text-xs text-green-400">${item.price} Br / шт.</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeCartCount(${item.id}, -1)" class="w-7 h-7 bg-zinc-800 rounded-lg text-white font-bold">-</button>
            <span class="text-sm font-bold w-4 text-center">${item.count}</span>
            <button onclick="changeCartCount(${item.id}, 1)" class="w-7 h-7 bg-zinc-800 rounded-lg text-white font-bold">+</button>
          </div>
        </div>
      `).join('');

      const totalSum = cart.reduce((acc, item) => acc + (item.price * item.count), 0);

      summary.innerHTML = `
        <div class="flex justify-between text-sm">
          <span class="text-zinc-400">Итого:</span>
          <span class="font-extrabold text-green-400 text-lg">${totalSum} Br</span>
        </div>
        <button onclick="showCheckout()" class="w-full py-3 bg-green-500 text-black font-extrabold rounded-xl shadow-lg hover:bg-green-400">
          Оформить заказ
        </button>
      `;
    }

    function changeCartCount(id, delta) {
      const item = cart.find(c => c.id === id);
      if (!item) return;

      if (delta > 0 && item.count + 1 > item.maxStock) {
        alert(`Максимальное количество в наличии: ${item.maxStock} шт.`);
        return;
      }

      item.count += delta;
      if (item.count <= 0) {
        cart = cart.filter(c => c.id !== id);
      }

      updateCartBadge();
      renderCart();
    }

    function showCheckout() {
      hideAllViews();
      document.getElementById('viewCheckout').classList.remove('hidden');
    }

    function setOrderType(type) {
      orderType = type;
      const btnDelivery = document.getElementById('btnDelivery');
      const btnPickup = document.getElementById('btnPickup');
      const addrField = document.getElementById('addressField');

      if (type === 'delivery') {
        btnDelivery.className = 'flex-1 py-2 rounded-lg bg-green-500 font-bold text-black';
        btnPickup.className = 'flex-1 py-2 rounded-lg text-zinc-400';
        addrField.classList.remove('hidden');
      } else {
        btnPickup.className = 'flex-1 py-2 rounded-lg bg-green-500 font-bold text-black';
        btnDelivery.className = 'flex-1 py-2 rounded-lg text-zinc-400';
        addrField.classList.add('hidden');
      }
    }

    // Отправка заказа в Бот
    function submitOrder(e) {
      e.preventDefault();

      const orderData = {
        type: orderType,
        address: document.getElementById('custAddress').value,
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        tg: document.getElementById('custTg').value,
        comment: document.getElementById('custComment').value,
        items: cart,
        total: cart.reduce((acc, item) => acc + (item.price * item.count), 0)
      };

      // Уменьшаем количество на складе
      cart.forEach(cItem => {
        const prod = products.find(p => p.id === cItem.id);
        if (prod) prod.stock -= cItem.count;
      });
      saveProducts();

      // Отправляем данные в Telegram бота
      if (tg) {
        tg.sendData(JSON.stringify(orderData));
      } else {
        alert("Заказ оформлен! (Данные отправлены в Telegram)");
      }

      cart = [];
      updateCartBadge();
      showCategories();
    }

    // Управление товарами (Админка)
    function toggleAdminModal() {
      const modal = document.getElementById('adminModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderAdminStock();
      }
    }

    function renderAdminStock() {
      const list = document.getElementById('adminStockList');
      list.innerHTML = products.map(p => `
        <div class="card-bg p-3 rounded-xl space-y-2 border border-zinc-800">
          <div class="flex justify-between font-bold text-green-400">
            <span>${p.name}</span>
            <span>${p.price} Br</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span>Кол-во в наличии:</span>
            <input type="number" value="${p.stock}" onchange="updateStock(${p.id}, this.value)" class="w-16 bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-center font-bold text-white">
          </div>
        </div>
      `).join('');
    }

    function updateStock(id, newStock) {
      const prod = products.find(p => p.id === id);
      if (prod) {
        prod.stock = parseInt(newStock) || 0;
        saveProducts();
      }
    }

    function addNewProductPrompt() {
      const name = prompt("Название товара:");
      if (!name) return;
      const category = prompt("Категория (например: Никобустеры, POD - системы, Жевательные смеси):", "Никобустеры");
      const price = parseFloat(prompt("Цена (Br):", "10")) || 0;
      const stock = parseInt(prompt("Количество на складе:", "5")) || 0;

      const newProd = {
        id: Date.now(),
        category,
        name,
        price,
        stock,
        img: 'https://via.placeholder.com/150/111/00FF00?text=New+Item',
        desc: 'Новое поступление'
      };

      products.push(newProd);
      saveProducts();
      renderAdminStock();
      renderCategories();
    }
  </script>
</body>
</html>
