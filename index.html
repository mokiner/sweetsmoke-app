<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SweetSmoke Borisov</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        :root {
            --green: #00ff41;
            --dark: #0a0a0a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://i.imgur.com/YOUR_BG1.jpg'); /* ← Замени на свои ссылки */
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .header {
            background: rgba(10,10,10,0.95);
            padding: 12px;
            text-align: center;
            border-bottom: 4px solid var(--green);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 22px;
            text-shadow: 0 0 15px var(--green);
            letter-spacing: 2px;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: rgba(0,0,0,0.9);
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #111;
            color: var(--green);
            border: 2px solid var(--green);
            padding: 10px 16px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .nav-btn.active, .nav-btn:hover {
            background: var(--green);
            color: #000;
            box-shadow: 0 0 20px var(--green);
        }
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .product {
            background: rgba(20,20,20,0.95);
            border: 3px solid #222;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .product:hover {
            transform: scale(1.08);
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(0,255,65,0.4);
        }
        .product img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border: 2px solid #333;
        }
        .product h3 { margin: 8px 0 4px; font-size: 13px; }
        .price { color: var(--green); font-weight: bold; }
        .stock { font-size: 10px; color: #aaa; margin-top: 4px; }
        
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.97);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            border: 4px solid var(--green);
            padding: 20px;
            max-width: 92%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .cart-float {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: var(--green);
            color: #000;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px var(--green);
            z-index: 900;
        }
        button {
            background: #000;
            color: var(--green);
            border: 2px solid var(--green);
            padding: 12px;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            margin: 8px 0;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 2px solid var(--green);
            color: white;
            margin: 6px 0;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">SWEETSMOKE BORISOV</div>
        <div style="font-size:11px;color:#0f0;margin-top:4px;">UNLEASH THE BEAST</div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="showSection('catalog')">КАТАЛОГ</button>
        <button class="nav-btn" onclick="showSection('cart')">КОРЗИНА <span id="cart-count">0</span></button>
    </div>

    <!-- Каталог -->
    <div id="catalog-section" class="section">
        <div class="catalog" id="products-grid"></div>
    </div>

    <!-- Корзина -->
    <div id="cart-section" class="section" style="display:none; padding:15px;">
        <h2 style="color:var(--green);">КОРЗИНА</h2>
        <div id="cart-items"></div>
        <div id="cart-total" style="font-size:18px; margin:20px 0; color:var(--green); text-align:center;"></div>
        <button onclick="checkout()">ОФОРМИТЬ ЗАКАЗ</button>
    </div>

    <!-- Модальное окно товара -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="float:right;font-size:28px;cursor:pointer;color:var(--green);">&times;</span>
            <img id="modal-image" style="width:100%;height:220px;object-fit:cover;">
            <h2 id="modal-title" style="margin:10px 0 5px;"></h2>
            <p id="modal-desc"></p>
            <div id="modal-variants" style="margin:15px 0;"></div>
            <div id="modal-price" class="price" style="font-size:18px;"></div>
            <div id="modal-stock" class="stock"></div>
            <button onclick="addCurrentToCart()">ДОБАВИТЬ В КОРЗИНУ</button>
        </div>
    </div>

    <!-- Оформление заказа -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <h2>ОФОРМЛЕНИЕ ЗАКАЗА</h2>
            <input type="text" id="name" placeholder="Имя" required>
            <input type="tel" id="phone" placeholder="Телефон" required>
            <input type="text" id="address" placeholder="Адрес доставки">
            <textarea id="comment" placeholder="Комментарий к заказу" rows="3"></textarea>
            <button onclick="submitOrder()">ОТПРАВИТЬ ЗАКАЗ В TELEGRAM</button>
            <button onclick="closeCheckout()" style="background:#333;">ОТМЕНА</button>
        </div>
    </div>

    <div class="cart-float" onclick="showSection('cart')">
        🛒 <span id="cart-count-bottom">0</span>
    </div>

    <script>
        let cart = [];
        let currentProduct = null;

        const products = [
            {
                id: 1,
                name: "Glitch (150 mg)",
                price: 13,
                stock: 45,
                image: "https://i.imgur.com/YOUR_PRODUCT1.jpg", // Замени
                variants: ["Полярная Мята", "Двойная мята", "Эвкалипт Мята"],
                desc: "Мощная жевательная смесь 150mg",
                category: "Жевательные смеси"
            },
            {
                id: 2,
                name: "Glitch (75 mg)",
                price: 13,
                stock: 28,
                image: "https://i.imgur.com/YOUR_PRODUCT2.jpg",
                variants: ["Полярная Мята"],
                desc: "Облегчённая версия",
                category: "Жевательные смеси"
            },
            // Добавляй сюда новые товары
        ];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} Br</div>
                    <div class="stock">В наличии: ${p.stock}</div>
                `;
                div.onclick = () => showProduct(p);
                grid.appendChild(div);
            });
        }

        function showProduct(product) {
            currentProduct = product;
            document.getElementById('modal-image').src = product.image;
            document.getElementById('modal-title').textContent = product.name;
            document.getElementById('modal-desc').textContent = product.desc;
            document.getElementById('modal-price').textContent = `${product.price} Br`;
            document.getElementById('modal-stock').textContent = `Остаток: ${product.stock} шт.`;

            const vDiv = document.getElementById('modal-variants');
            vDiv.innerHTML = '<strong>Варианты вкуса:</strong><br>';
            product.variants.forEach(v => {
                const btn = document.createElement('button');
                btn.textContent = v;
                btn.style.margin = '4px';
                vDiv.appendChild(btn);
            });

            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function addCurrentToCart() {
            if (!currentProduct || currentProduct.stock <= 0) {
                alert("Товара нет в наличии!");
                return;
            }
            cart.push({...currentProduct, quantity: 1});
            updateCart();
            closeModal();
            alert("✅ Добавлено в корзину!");
        }

        function updateCart() {
            const count = cart.length;
            document.getElementById('cart-count').textContent = count;
            document.getElementById('cart-count-bottom').textContent = count;
        }

        function showSection(section) {
            document.getElementById('catalog-section').style.display = section === 'catalog' ? 'block' : 'none';
            document.getElementById('cart-section').style.display = section === 'cart' ? 'block' : 'none';
            
            if (section === 'cart') renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, i) => {
                const div = document.createElement('div');
                div.style = 'margin:12px 0; padding:10px; background:#1a1a1a; border:1px solid #333;';
                div.innerHTML = `
                    <strong>${item.name}</strong><br>
                    ${item.price} Br × ${item.quantity} = <span style="color:var(--green)">${item.price * item.quantity} Br</span>
                    <button onclick="removeFromCart(${i})" style="float:right;background:#900;color:white;border:none;padding:4px 8px;">✕</button>
                `;
                container.appendChild(div);
                total += item.price * item.quantity;
            });

            document.getElementById('cart-total').textContent = `ИТОГО: ${total} Br`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) return alert("Корзина пуста");
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function submitOrder() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            if (!name || !phone) return alert("Заполните имя и телефон!");

            const orderData = {
                user: window.Telegram?.WebApp?.initDataUnsafe?.user || {username: "unknown"},
                items: cart,
                total: cart.reduce((sum, i) => sum + i.price * i.quantity, 0),
                name, phone,
                address: document.getElementById('address').value,
                comment: document.getElementById('comment').value,
                time: new Date().toLocaleString('ru-RU')
            };

            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify(orderData));
                Telegram.WebApp.close();
            } else {
                console.log("ЗАКАЗ:", orderData);
                alert("Заказ отправлен (тестовый режим)");
            }

            cart = [];
            updateCart();
            closeCheckout();
            showSection('catalog');
        }

        // Инициализация
        window.onload = () => {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            renderProducts();
            updateCart();
        };
    </script>
</body>
</html>
