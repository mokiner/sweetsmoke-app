<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <title>VELIX</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>

    body{

      background:#131415;

      color:#fff;

      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;

      -webkit-tap-highlight-color:transparent;

    }

    .card{background:#1c1d1e;border-radius:16px}

    .input{background:#242526;border:1px solid #333436;color:#fff}

    .input:focus{outline:none;border-color:#2481cc}

    .btn{background:#2481cc}

  </style>

</head>

<body class="pb-24">

<div class="max-w-md mx-auto min-h-screen flex flex-col">

  <!-- HEADER -->

  <header class="sticky top-0 z-30 bg-[#131415]/95 backdrop-blur border-b border-gray-800 p-3 flex items-center justify-between">

    <div class="flex items-center gap-2 min-w-0">

      <button id="backBtn" class="hidden text-blue-400 text-sm" onclick="goBack()">

        <i class="fa-solid fa-chevron-left"></i> Назад

      </button>

      <div id="breadcrumbs" class="text-xs font-semibold truncate">Каталог</div>

    </div>

    <button id="adminBtn" class="hidden text-xs px-3 py-2 rounded-xl border border-blue-500/40 bg-blue-500/10 text-blue-400" onclick="openAdmin()">

      <i class="fa-solid fa-gear"></i> Управление

    </button>

  </header>

  <!-- MAIN -->

  <main class="flex-1 p-3">

    <div class="relative mb-3">

      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>

      <input id="searchInput" oninput="searchCatalog()" class="w-full input rounded-xl py-2 pl-9 pr-4 text-sm" placeholder="Найти товар..." />

    </div>

    <div id="viewCategories" class="grid grid-cols-2 gap-3"></div>

    <div id="viewSubcategories" class="hidden grid grid-cols-2 gap-3"></div>

    <div id="viewProducts" class="hidden grid grid-cols-2 gap-3"></div>

    <div id="viewDetail" class="hidden"></div>

    <div id="viewSearch" class="hidden grid grid-cols-2 gap-3"></div>

    <div id="viewCart" class="hidden space-y-3"></div>

  </main>

  <!-- BOTTOM NAV -->

  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1b1c] border-t border-gray-800 px-2 py-2 flex justify-around text-xs text-gray-400 z-40">

    <button onclick="renderCategories()" class="flex flex-col items-center gap-1 text-blue-400">

      <i class="fa-solid fa-border-all text-base"></i><span>Каталог</span>

    </button>

    <button onclick="document.getElementById('searchInput').focus()" class="flex flex-col items-center gap-1">

      <i class="fa-solid fa-magnifying-glass text-base"></i><span>Найти</span>

    </button>

    <button onclick="renderCart()" class="flex flex-col items-center gap-1 relative">

      <i class="fa-solid fa-cart-shopping text-base"></i>

      <span>Корзина</span>

      <span id="cartBadge" class="hidden absolute -top-1 right-2 bg-blue-500 text-white rounded-full text-[10px] w-4 h-4 flex items-center justify-center">0</span>

    </button>

    <button class="flex flex-col items-center gap-1"><i class="fa-regular fa-heart text-base"></i><span>Избранное</span></button>

    <button class="flex flex-col items-center gap-1"><i class="fa-regular fa-user text-base"></i><span>Профиль</span></button>

    <button class="flex flex-col items-center gap-1"><i class="fa-solid fa-bars text-base"></i><span>Еще</span></button>

  </nav>

</div>

<!-- ADMIN MODAL -->

<div id="adminModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur z-50 p-4">

  <div class="bg-[#1c1d1e] rounded-2xl max-w-md mx-auto h-full flex flex-col border border-gray-800">

    <div class="p-4 border-b border-gray-800 flex items-center justify-between">

      <div>

        <div class="font-bold">Управление каталогом</div>

        <div id="adminPath" class="text-xs text-blue-400 mt-1">Категории</div>

      </div>

      <button onclick="closeAdmin()" class="text-xl text-gray-400">&times;</button>

    </div>

    <div id="adminList" class="flex-1 overflow-y-auto p-4 space-y-2"></div>

    <div class="p-4 border-t border-gray-800">

      <button id="adminAddBtn" onclick="adminAdd()" class="w-full btn py-3 rounded-xl font-bold">Добавить</button>

    </div>

  </div>

</div>

<script>

const tg = window.Telegram?.WebApp;

tg?.expand();

const ADMIN_USERS = ['beerezka0','mokiner'];

const username = (tg?.initDataUnsafe?.user?.username || '').toLowerCase();

const isAdmin = ADMIN_USERS.includes(username);

if(isAdmin){

  document.getElementById('adminBtn').classList.remove('hidden');

}

const FALLBACK = 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400&auto=format&fit=crop&q=60';

const defaultData = {

  categories:[

    {

      id:crypto.randomUUID(),

      title:'Жевательные смеси',

      image:FALLBACK,

      subcategories:[

        {

          id:crypto.randomUUID(),

          title:'Glitch',

          image:FALLBACK,

          products:[

            {

              id:crypto.randomUUID(),

              title:'Glitch 150 mg',

              image:FALLBACK,

              price:13,

              description:'Мощная жевательная смесь.'

            }

          ]

        }

      ]

    }

  ]

};

let db = JSON.parse(localStorage.getItem('velix_catalog') || 'null') || defaultData;

let cart = JSON.parse(localStorage.getItem('velix_cart') || '[]');

function saveDB(){

  localStorage.setItem('velix_catalog', JSON.stringify(db));

}

function saveCart(){

  localStorage.setItem('velix_cart', JSON.stringify(cart));

}

let current = {

  view:'categories',

  category:null,

  subcategory:null,

  product:null

};

function setCrumbs(arr){

  document.getElementById('breadcrumbs').innerHTML = arr.join(' > ');

}

function show(view){

  ['Categories','Subcategories','Products','Detail','Search','Cart']

    .forEach(v=>document.getElementById('view'+v).classList.add('hidden'));

  document.getElementById('view'+view).classList.remove('hidden');

  current.view = view.toLowerCase();

  document.getElementById('backBtn').classList.toggle('hidden', view==='Categories');

}

/* ---------- CATALOG ---------- */

function renderCategories(){

  current.category = null;

  current.subcategory = null;

  const el = document.getElementById('viewCategories');

  el.innerHTML = db.categories.map(c=>`

    <div class="card p-3 cursor-pointer" onclick="openCategory('${c.id}')">

      <img src="${c.image}" class="w-full h-32 object-cover rounded-xl bg-gray-800" onerror="this.src='${FALLBACK}'">

      <div class="text-sm font-semibold mt-2 text-center">${c.title}</div>

    </div>

  `).join('');

  setCrumbs(['Каталог']);

  show('Categories');

}

function openCategory(id){

  current.category = db.categories.find(c=>c.id===id);

  const el = document.getElementById('viewSubcategories');

  el.innerHTML = current.category.subcategories.map(s=>`

    <div class="card p-3 cursor-pointer" onclick="openSubcategory('${s.id}')">

      <img src="${s.image}" class="w-full h-32 object-cover rounded-xl bg-gray-800" onerror="this.src='${FALLBACK}'">

      <div class="text-sm font-semibold mt-2 text-center">${s.title}</div>

    </div>

  `).join('');

  setCrumbs(['Каталог', current.category.title]);

  show('Subcategories');

}

function openSubcategory(id){

  current.subcategory = current.category.subcategories.find(s=>s.id===id);

  const el = document.getElementById('viewProducts');

  el.innerHTML = current.subcategory.products.map(p=>`

    <div class="card p-3 cursor-pointer" onclick="openProduct('${p.id}')">

      <img src="${p.image}" class="w-full h-32 object-cover rounded-xl bg-gray-800" onerror="this.src='${FALLBACK}'">

      <div class="mt-2 font-semibold text-sm line-clamp-2">${p.title}</div>

      <div class="mt-3 flex items-center justify-between">

        <span class="font-bold">${p.price} Br</span>

        <button type="button" onclick="event.stopPropagation(); quickAdd('${p.id}')" class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center">

          <i class="fa-solid fa-cart-shopping"></i>

        </button>

      </div>

    </div>

  `).join('');

  setCrumbs(['Каталог', current.category.title, current.subcategory.title]);

  show('Products');

}

function openProduct(id){

  current.product = current.subcategory.products.find(p=>p.id===id);

  document.getElementById('viewDetail').innerHTML = `

    <div class="space-y-4">

      <img src="${current.product.image}" class="w-full h-64 object-cover rounded-2xl bg-gray-800" onerror="this.src='${FALLBACK}'">

      <div>

        <h1 class="text-xl font-bold">${current.product.title}</h1>

        <p class="text-sm text-gray-400 mt-2">${current.product.description || 'Описание отсутствует'}</p>

      </div>

      <div class="flex items-center justify-between pt-2">

        <div class="text-2xl font-bold">${current.product.price} Br</div>

        <button onclick="addToCart(current.product)" class="btn px-5 py-3 rounded-xl font-bold">

          В корзину

        </button>

      </div>

    </div>

  `;

  setCrumbs(['Каталог', current.category.title, current.subcategory.title, current.product.title]);

  show('Detail');

}

/* ---------- SEARCH ---------- */

function searchCatalog(){

  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  if(!q){

    renderCategories();

    return;

  }

  const found = [];

  db.categories.forEach(c=>{

    c.subcategories.forEach(s=>{

      s.products.forEach(p=>{

        if(p.title.toLowerCase().includes(q)){

          found.push({c,s,p});

        }

      });

    });

  });

  document.getElementById('viewSearch').innerHTML = found.map(({p})=>`

    <div class="card p-3">

      <img src="${p.image}" class="w-full h-28 object-cover rounded-xl bg-gray-800" onerror="this.src='${FALLBACK}'">

      <div class="text-sm font-semibold mt-2">${p.title}</div>

      <div class="text-blue-400 font-bold mt-1">${p.price} Br</div>

    </div>

  `).join('');

  setCrumbs(['Каталог','Поиск']);

  show('Search');

}

/* ---------- CART ---------- */

function quickAdd(id){

  const p = current.subcategory.products.find(x=>x.id===id);

  addToCart(p);

}

function addToCart(product){

  const item = cart.find(i=>i.id===product.id);

  if(item){

    item.qty++;

  }else{

    cart.push({...product, qty:1});

  }

  saveCart();

  updateCartBadge();

  tg?.HapticFeedback?.notificationOccurred('success');

}

function updateCartBadge(){

  const count = cart.reduce((s,i)=>s+i.qty,0);

  const badge = document.getElementById('cartBadge');

  if(count){

    badge.textContent = count;

    badge.classList.remove('hidden');

  }else{

    badge.classList.add('hidden');

  }

}

function renderCart(){

  const el = document.getElementById('viewCart');

  if(!cart.length){

    el.innerHTML = '<div class="text-center text-gray-500 py-16">Корзина пуста</div>';

  }else{

    const total = cart.reduce((s,i)=>s+i.price*i.qty,0);

    el.innerHTML = cart.map((i,idx)=>`

      <div class="card p-3 flex items-center gap-3">

        <img src="${i.image}" class="w-14 h-14 rounded-lg object-cover bg-gray-800" onerror="this.src='${FALLBACK}'">

        <div class="flex-1">

          <div class="font-semibold text-sm">${i.title}</div>

          <div class="text-gray-400 text-xs">${i.price} Br</div>

        </div>

        <div class="flex items-center gap-2 bg-gray-800 rounded-lg px-2 py-1">

          <button onclick="changeQty(${idx},-1)" class="w-6 h-6">-</button>

          <span class="font-bold text-sm">${i.qty}</span>

          <button onclick="changeQty(${idx},1)" class="w-6 h-6">+</button>

        </div>

      </div>

    `).join('') + `

      <div class="card p-4 flex items-center justify-between">

        <span class="font-bold">Итого</span>

        <span class="font-bold text-lg">${total} Br</span>

      </div>

    `;

  }

  setCrumbs(['Каталог','Корзина']);

  show('Cart');

}

function changeQty(idx,delta){

  cart[idx].qty += delta;

  if(cart[idx].qty <= 0){

    cart.splice(idx,1);

  }

  saveCart();

  updateCartBadge();

  renderCart();

}

/* ---------- BACK ---------- */

function goBack(){

  if(current.view==='subcategories') renderCategories();

  else if(current.view==='products') openCategory(current.category.id);

  else if(current.view==='detail') openSubcategory(current.subcategory.id);

  else if(current.view==='search') renderCategories();

  else if(current.view==='cart') renderCategories();

}

/* ---------- ADMIN ---------- */

let adminState = {

  level:'categories',

  category:null,

  subcategory:null

};

function openAdmin(){

  adminState = { level:'categories', category:null, subcategory:null };

  document.getElementById('adminModal').classList.remove('hidden');

  renderAdmin();

}

function closeAdmin(){

  document.getElementById('adminModal').classList.add('hidden');

}

function renderAdmin(){

  const list = document.getElementById('adminList');

  const path = document.getElementById('adminPath');

  if(adminState.level==='categories'){

    path.textContent = 'Категории';

    list.innerHTML = db.categories.map(c=>`

      <div class="bg-[#242526] rounded-xl p-3 flex items-center gap-3">

        <img src="${c.image}" class="w-12 h-12 rounded-lg object-cover bg-gray-800" onerror="this.src='${FALLBACK}'">

        <div class="flex-1 cursor-pointer" onclick="enterCategory('${c.id}')">

          <div class="font-semibold text-sm">${c.title}</div>

          <div class="text-xs text-gray-400">${c.subcategories.length} видов</div>

        </div>

        <button onclick="deleteCategory('${c.id}')" class="text-red-400 text-sm px-3 py-2 bg-red-500/10 rounded-lg">

          Удалить

        </button>

      </div>

    `).join('');

  }

  if(adminState.level==='subcategories'){

    const c = db.categories.find(x=>x.id===adminState.category);

    path.innerHTML = `<span class="underline cursor-pointer" onclick="adminState.level='categories';renderAdmin()">Категории</span> > ${c.title}`;

    list.innerHTML = c.subcategories.map(s=>`

      <div class="bg-[#242526] rounded-xl p-3 flex items-center gap-3">

        <img src="${s.image}" class="w-12 h-12 rounded-lg object-cover bg-gray-800" onerror="this.src='${FALLBACK}'">

        <div class="flex-1 cursor-pointer" onclick="enterSubcategory('${s.id}')">

          <div class="font-semibold text-sm">${s.title}</div>

          <div class="text-xs text-gray-400">${s.products.length} товаров</div>

        </div>

        <button onclick="deleteSubcategory('${s.id}')" class="text-red-400 text-sm px-3 py-2 bg-red-500/10 rounded-lg">

          Удалить

        </button>

      </div>

    `).join('');

  }

  if(adminState.level==='products'){

    const c = db.categories.find(x=>x.id===adminState.category);

    const s = c.subcategories.find(x=>x.id===adminState.subcategory);

    path.innerHTML = `<span class="underline cursor-pointer" onclick="adminState.level='categories';renderAdmin()">Категории</span> > <span class="underline cursor-pointer" onclick="adminState.level='subcategories';renderAdmin()">${c.title}</span> > ${s.title}`;

    list.innerHTML = s.products.map(p=>`

      <div class="bg-[#242526] rounded-xl p-3 flex items-center gap-3">

        <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover bg-gray-800" onerror="this.src='${FALLBACK}'">

        <div class="flex-1">

          <div class="font-semibold text-sm">${p.title}</div>

          <div class="text-xs text-blue-400">${p.price} Br</div>

        </div>

        <button onclick="deleteProduct('${p.id}')" class="text-red-400 text-sm px-3 py-2 bg-red-500/10 rounded-lg">

          Удалить

        </button>

      </div>

    `).join('');

  }

}

function enterCategory(id){

  adminState.level = 'subcategories';

  adminState.category = id;

  renderAdmin();

}

function enterSubcategory(id){

  adminState.level = 'products';

  adminState.subcategory = id;

  renderAdmin();

}

/* ---------- ADD ---------- */

function adminAdd(){

  if(adminState.level==='categories'){

    const title = prompt('Название категории');

    if(!title) return;

    const image = prompt('Ссылка на фото') || FALLBACK;

    db.categories.push({

      id:crypto.randomUUID(),

      title,

      image,

      subcategories:[]

    });

    saveDB();

    renderAdmin();

    renderCategories();

  }

  else if(adminState.level==='subcategories'){

    const c = db.categories.find(x=>x.id===adminState.category);

    const title = prompt('Название вида');

    if(!title) return;

    const image = prompt('Ссылка на фото') || FALLBACK;

    c.subcategories.push({

      id:crypto.randomUUID(),

      title,

      image,

      products:[]

    });

    saveDB();

    renderAdmin();

  }

  else if(adminState.level==='products'){

    const c = db.categories.find(x=>x.id===adminState.category);

    const s = c.subcategories.find(x=>x.id===adminState.subcategory);

    const title = prompt('Название товара');

    if(!title) return;

    const image = prompt('Ссылка на фото') || FALLBACK;

    const price = Number(prompt('Цена', '13')) || 0;

    const description = prompt('Описание товара') || '';

    s.products.push({

      id:crypto.randomUUID(),

      title,

      image,

      price,

      description

    });

    saveDB();

    renderAdmin();

  }

}

/* ---------- DELETE ---------- */

function deleteCategory(id){

  if(!confirm('Удалить категорию?')) return;

  db.categories = db.categories.filter(c=>c.id!==id);

  saveDB();

  renderAdmin();

  renderCategories();

}

function deleteSubcategory(id){

  if(!confirm('Удалить вид?')) return;

  const c = db.categories.find(x=>x.id===adminState.category);

  c.subcategories = c.subcategories.filter(s=>s.id!==id);

  saveDB();

  renderAdmin();

}

function deleteProduct(id){

  if(!confirm('Удалить товар?')) return;

  const c = db.categories.find(x=>x.id===adminState.category);

  const s = c.subcategories.find(x=>x.id===adminState.subcategory);

  s.products = s.products.filter(p=>p.id!==id);

  saveDB();

  renderAdmin();

}

/* ---------- INIT ---------- */

updateCartBadge();

renderCategories();

</script>

</body>

</html>
