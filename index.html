<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VELIX Web App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #131415;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tg-card { background-color: #1c1d1e; border-radius: 14px; }
    .tg-input { background-color: #242526; border: 1px solid #333436; color: #fff; }
    .tg-input:focus { border-color: #2481cc; outline: none; }
    
    @keyframes slideDown {
      from { transform: translate(-50%, -100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .toast-anim { animation: slideDown 0.3s ease-out forwards; }
  </style>
</head>
<body class="pb-24">

  <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] w-11/12 max-w-sm pointer-events-none flex flex-col gap-2"></div>

  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
    <header id="header" class="p-3 border-b border-gray-800 sticky top-0 bg-[#131415]/95 backdrop-blur z-30 flex items-center justify-between">
      <div class="flex items-center space-x-2 overflow-hidden">
        <button id="back-btn" onclick="goBack()" class="hidden text-blue-400 text-sm flex items-center gap-1 font-medium shrink-0">
          <i class="fa-solid fa-chevron-left"></i> Назад
        </button>
        <div id="breadcrumbs" class="text-xs font-semibold text-gray-300 truncate">Каталог</div>
      </div>

      <!-- Кнопка «Управление» (Скрыта, видна только администраторам @beerezka0 и @mokiner) -->
      <button id="admin-btn" onclick="toggleAdminModal()" class="hidden text-xs text-blue-400 bg-blue-500/10 border border-blue-500/30 px-2.5 py-1.5 rounded-xl hover:bg-blue-500/20 flex items-center gap-1.5 shrink-0 font-medium">
        <i class="fa-solid fa-gear text-xs"></i> Управление
      </button>
    </header>

    <main id="main-content" class="p-3 flex-1">
      <div id="search-box" class="relative mb-3">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="Найти товар..." class="w-full tg-input rounded-xl py-2 pl-9 pr-4 text-sm">
      </div>

      <div id="view-categories" class="grid grid-cols-2 gap-3"></div>
      <div id="view-subcategories" class="hidden grid grid-cols-2 gap-3"></div>
      <div id="view-products" class="hidden grid grid-cols-2 gap-3"></div>
      <div id="view-detail" class="hidden space-y-4"></div>
      <div id="view-cart" class="hidden space-y-4"></div>
      <div id="view-checkout" class="hidden space-y-3"></div>
      <div id="view-search" class="hidden grid grid-cols-2 gap-3"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1b1c] border-t border-gray-800 px-2 py-2 flex justify-around items-center z-40 text-xs text-gray-400">
      <button onclick="switchTab('catalog')" id="nav-catalog" class="flex flex-col items-center gap-1 text-blue-400">
        <i class="fa-solid fa-border-all text-base"></i><span>Каталог</span>
      </button>
      <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center gap-1">
        <i class="fa-solid fa-magnifying-glass text-base"></i><span>Найти</span>
      </button>
      <button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center gap-1 relative">
        <i class="fa-solid fa-cart-shopping text-base"></i><span>Корзина</span>
        <span id="cart-badge" class="hidden absolute -top-1 right-2 bg-blue-500 text-white font-bold rounded-full text-[10px] w-4 h-4 flex items-center justify-center">0</span>
      </button>
      <button onclick="showToast('Избранное', 'info')" class="flex flex-col items-center gap-1">
        <i class="fa-regular fa-heart text-base"></i><span>Избранное</span>
      </button>
      <button onclick="showToast('Профиль', 'info')" class="flex flex-col items-center gap-1">
        <i class="fa-regular fa-user text-base"></i><span>Профиль</span>
      </button>
    </nav>
  </div>

  <!-- АДМИН-ПАНЕЛЬ -->
  <div id="admin-modal" class="fixed inset-0 bg-[#131415]/95 backdrop-blur-md z-50 hidden flex flex-col p-4">
    <div class="bg-[#1c1d1e] rounded-2xl flex-1 flex flex-col overflow-hidden max-w-md w-full mx-auto border border-gray-800 shadow-2xl">
      <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#242526]">
        <div>
          <h2 class="text-base font-bold text-white"><i class="fa-solid fa-sliders text-blue-400 mr-2"></i>Управление</h2>
          <div id="sync-status" class="text-[10px] text-gray-400 mt-1">⏳ Синхронизация...</div>
        </div>
        <button onclick="toggleAdminModal()" class="w-8 h-8 flex items-center justify-center bg-gray-800 rounded-full text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="admin-breadcrumbs" class="px-4 py-2 text-xs font-semibold text-blue-400 bg-[#1a1b1c] border-b border-gray-800">Категории</div>

      <div id="admin-list" class="flex-1 overflow-y-auto p-3 space-y-2"></div>

      <div class="p-4 border-t border-gray-800 bg-[#1a1b1c]">
        <button id="admin-add-btn" onclick="openAddModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> Добавить
        </button>
      </div>
    </div>
  </div>

  <!-- ФОРМА ДОБАВЛЕНИЯ -->
  <div id="form-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[60] hidden flex flex-col p-4 justify-center">
    <div class="bg-[#1c1d1e] rounded-2xl p-5 max-w-md w-full mx-auto space-y-4 border border-gray-800 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 id="form-title" class="text-base font-bold text-white">Добавить</h3>
        <button onclick="closeFormModal()" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1.5 ml-1">Название *</label>
        <input type="text" id="form-title-input" placeholder="Введите название..." class="w-full tg-input rounded-xl p-3 text-sm">
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1.5 ml-1">Ссылка на фото (URL) *</label>
        <input type="text" id="form-image-input" placeholder="https://..." class="w-full tg-input rounded-xl p-3 text-sm">
      </div>
      <div id="product-extra-fields" class="hidden space-y-4 pt-1">
        <div>
          <label class="text-xs text-gray-400 block mb-1.5 ml-1">Цена (Br) *</label>
          <input type="number" id="form-price-input" placeholder="15" class="w-full tg-input rounded-xl p-3 text-sm">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1.5 ml-1">Описание товара</label>
          <textarea id="form-desc-input" rows="3" placeholder="Описание, характеристики..." class="w-full tg-input rounded-xl p-3 text-sm resize-none"></textarea>
        </div>
      </div>
      <div class="flex gap-3 pt-4">
        <button type="button" onclick="closeFormModal()" class="flex-1 bg-gray-800 text-white text-sm py-3.5 rounded-xl font-bold">Отмена</button>
        <button type="button" id="save-form-btn" onclick="saveFormElement()" class="flex-1 bg-blue-600 text-white text-sm py-3.5 rounded-xl font-bold shadow-lg">Сохранить</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.enableClosingConfirmation(); }

    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      let bgColor = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
      toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold text-center toast-anim`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=300&auto=format&fit=crop&q=60';

    // Проверка админов
    const ADMIN_USERS = ['beerezka0', 'mokiner'];
    const tgUser = tg?.initDataUnsafe?.user;
    const currentUsername = (tgUser?.username || '').replace('@', '').trim().toLowerCase();
    if (ADMIN_USERS.map(u => u.toLowerCase()).includes(currentUsername)) {
      document.getElementById('admin-btn').classList.remove('hidden');
    }

    // Ваши реальные ключи из Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBzZ3sloa_KWpUh1aIkqgW...",
      authDomain: "velix-f9dfb.firebaseapp.com",
      projectId: "velix-f9dfb",
      storageBucket: "velix-f9dfb.firebasestorage.app",
      messagingSenderId: "298840084599",
      appId: "1:298840084599:web:41389d333f..."
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'velix-shop';
    const catalogDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'catalog_main');

    window.appState = {
      categories: [],
      cart: [],
      currentView: 'categories',
      selectedCat: null,
      selectedSubCat: null,
      selectedProduct: null
    };

    let adminLevel = 'categories';
    let selectedAdminCatId = null;
    let selectedAdminSubCatId = null;
    let lastHash = '';

    async function initCloudSync() {
      try {
        await signInAnonymously(auth);
        onSnapshot(catalogDocRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.categories) {
              const currentHash = JSON.stringify(data.categories);
              if (currentHash !== lastHash) {
                lastHash = currentHash;
                window.appState.categories = data.categories;
                refreshCurrentUserView();
                refreshAdminView();
                document.getElementById('sync-status').innerText = '🟢 База синхронизирована';
              }
            }
          } else {
            setDoc(catalogDocRef, { categories: [], updatedAt: serverTimestamp() });
          }
        }, (err) => {
          document.getElementById('sync-status').innerText = '🔴 Ошибка сети';
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function saveToCloud() {
      document.getElementById('sync-status').innerText = '⏳ Сохранение...';
      try {
        await setDoc(catalogDocRef, { categories: window.appState.categories, updatedAt: serverTimestamp() }, { merge: true });
        return true;
      } catch (err) {
        showToast('Ошибка сохранения', 'error');
        return false;
      }
    }

    // Пользовательская навигация
    function updateBreadcrumbs(crumbs) {
      document.getElementById('breadcrumbs').innerHTML = crumbs.join(' <span class="text-gray-600 font-normal mx-1">&gt;</span> ');
    }

    window.navigateTo = function(view) {
      window.appState.currentView = view;
      ['categories', 'subcategories', 'products', 'detail', 'cart', 'checkout', 'search'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
      });
      document.getElementById(`view-${view}`).classList.remove('hidden');
      document.getElementById('back-btn').classList.toggle('hidden', view === 'categories');
      document.getElementById('search-box').classList.toggle('hidden', ['detail', 'cart', 'checkout'].includes(view));
    };

    window.goBack = function() {
      if (window.appState.currentView === 'subcategories') renderUserCategories();
      else if (window.appState.currentView === 'products') window.openUserCategory(window.appState.selectedCat.id);
      else if (window.appState.currentView === 'detail') window.openUserSubCategory(window.appState.selectedSubCat.id);
      else renderUserCategories();
    };

    window.switchTab = function(tab) {
      if (tab === 'catalog') renderUserCategories();
      else if (tab === 'search') { document.getElementById('search-input').focus(); window.navigateTo('search'); updateBreadcrumbs(['Поиск']); }
      else if (tab === 'cart') renderCart();
    };

    function refreshCurrentUserView() {
      const v = window.appState.currentView;
      if (v === 'categories') renderUserCategories();
      else if (v === 'subcategories' && window.appState.selectedCat) window.openUserCategory(window.appState.selectedCat.id);
      else if (v === 'products' && window.appState.selectedSubCat) window.openUserSubCategory(window.appState.selectedSubCat.id);
      else if (v === 'detail' && window.appState.selectedProduct) window.openProductDetail(window.appState.selectedProduct.id);
    }

    window.renderUserCategories = function() {
      window.appState.selectedCat = null;
      const container = document.getElementById('view-categories');
      if (!window.appState.categories.length) {
        container.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-500 text-sm">Каталог пуст.</div>`;
      } else {
        container.innerHTML = window.appState.categories.map(cat => `
          <div onclick="openUserCategory('${cat.id}')" class="tg-card p-2.5 rounded-2xl flex flex-col items-center cursor-pointer">
            <img src="${cat.image}" loading="lazy" class="w-full h-28 object-cover rounded-xl mb-2" onerror="this.src='${FALLBACK_IMAGE}'">
            <span class="text-xs font-bold text-white line-clamp-1">${cat.title}</span>
          </div>
        `).join('');
      }
      updateBreadcrumbs(['Каталог']);
      window.navigateTo('categories');
    };

    window.openUserCategory = function(catId) {
      const cat = window.appState.categories.find(c => c.id === catId);
      if (!cat) return renderUserCategories();
      window.appState.selectedCat = cat;
      const container = document.getElementById('view-subcategories');
      container.innerHTML = (cat.subcategories || []).map(sub => `
        <div onclick="openUserSubCategory('${sub.id}')" class="tg-card p-2.5 rounded-2xl flex flex-col items-center cursor-pointer">
          <img src="${sub.image}" loading="lazy" class="w-full h-28 object-cover rounded-xl mb-2" onerror="this.src='${FALLBACK_IMAGE}'">
          <span class="text-xs font-bold text-white line-clamp-1">${sub.title}</span>
        </div>
      `).join('') || `<div class="col-span-2 text-center py-10 text-gray-500 text-sm">Нет видов</div>`;
      updateBreadcrumbs(['Каталог', cat.title]);
      window.navigateTo('subcategories');
    };

    window.openUserSubCategory = function(subId) {
      const sub = window.appState.selectedCat?.subcategories?.find(s => s.id === subId);
      if (!sub) return window.openUserCategory(window.appState.selectedCat.id);
      window.appState.selectedSubCat = sub;
      const container = document.getElementById('view-products');
      container.innerHTML = (sub.products || []).map(prod => `
        <div onclick="openProductDetail('${prod.id}')" class="tg-card p-2.5 rounded-2xl flex flex-col justify-between cursor-pointer">
          <div>
            <img src="${prod.image}" loading="lazy" class="w-full h-28 object-cover rounded-xl mb-2" onerror="this.src='${FALLBACK_IMAGE}'">
            <h3 class="text-xs font-bold text-white leading-tight line-clamp-2">${prod.title}</h3>
          </div>
          <div class="mt-3 flex justify-between items-center">
            <span class="text-sm font-bold text-blue-400">${prod.price} Br</span>
            <button class="w-7 h-7 bg-blue-600 rounded-lg text-white text-xs"><i class="fa-solid fa-cart-plus"></i></button>
          </div>
        </div>
      `).join('') || `<div class="col-span-2 text-center py-10 text-gray-500 text-sm">Нет товаров</div>`;
      updateBreadcrumbs(['Каталог', window.appState.selectedCat.title, sub.title]);
      window.navigateTo('products');
    };

    window.openProductDetail = function(prodId) {
      const prod = window.appState.selectedSubCat?.products?.find(p => p.id === prodId);
      if (!prod) return window.openUserSubCategory(window.appState.selectedSubCat.id);
      window.appState.selectedProduct = prod;

      document.getElementById('view-detail').innerHTML = `
        <div class="space-y-4 pb-20">
          <img src="${prod.image}" loading="lazy" class="w-full h-64 object-cover rounded-2xl shadow-lg" onerror="this.src='${FALLBACK_IMAGE}'">
          <div class="bg-[#1c1d1e] p-4 rounded-2xl border border-gray-800">
            <h1 class="text-lg font-bold text-white mb-2">${prod.title}</h1>
            <div class="text-blue-400 font-bold text-lg mb-3">${prod.price} Br</div>
            <div class="text-sm text-gray-300 bg-[#131415] p-3 rounded-xl border border-gray-800">${prod.description || 'Описание отсутствует.'}</div>
          </div>
        </div>
        <div class="fixed bottom-[60px] left-0 right-0 max-w-md mx-auto px-4 py-3 bg-[#131415]/95 backdrop-blur-md border-t border-gray-800 z-40">
          <button onclick="addToCart()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-cart-shopping"></i> Добавить в корзину
          </button>
        </div>
      `;
      updateBreadcrumbs(['Каталог', window.appState.selectedCat.title, window.appState.selectedSubCat.title, 'Товар']);
      window.navigateTo('detail');
    };

    window.addToCart = function() {
      const prod = window.appState.selectedProduct;
      const existing = window.appState.cart.find(i => i.prodId === prod.id);
      if (existing) existing.quantity += 1;
      else window.appState.cart.push({ prodId: prod.id, title: prod.title, price: prod.price, image: prod.image, quantity: 1 });
      updateCartBadge();
      showToast('Добавлено в корзину');
    };

    window.renderCart = function() {
      const container = document.getElementById('view-cart');
      const total = window.appState.cart.reduce((s, i) => s + (i.price * i.quantity), 0);
      if (!window.appState.cart.length) {
        container.innerHTML = `<div class="text-center py-20 text-gray-500 font-bold"><i class="fa-solid fa-basket-shopping text-4xl mb-4 block"></i>Корзина пуста</div>`;
      } else {
        container.innerHTML = `
          <div class="space-y-3">
            ${window.appState.cart.map((item, idx) => `
              <div class="tg-card p-3 rounded-xl flex items-center gap-3">
                <img src="${item.image}" class="w-14 h-14 object-cover rounded-lg bg-gray-800">
                <div class="flex-1 min-w-0">
                  <h4 class="text-xs font-bold text-white line-clamp-1">${item.title}</h4>
                  <p class="text-xs text-blue-400 font-bold">${item.price} Br</p>
                </div>
                <div class="flex items-center bg-[#242526] rounded-lg p-0.5 border border-gray-700">
                  <button onclick="updateCartQty(${idx}, -1)" class="w-7 h-7 text-gray-300"><i class="fa-solid fa-minus text-[10px]"></i></button>
                  <span class="text-xs font-bold text-white w-6 text-center">${item.quantity}</span>
                  <button onclick="updateCartQty(${idx}, 1)" class="w-7 h-7 text-gray-300"><i class="fa-solid fa-plus text-[10px]"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="bg-[#1c1d1e] p-4 rounded-xl border border-gray-800 mt-4 flex justify-between font-bold text-white">
             <span>К оплате:</span><span class="text-blue-400">${total} Br</span>
          </div>
          <button onclick="openCheckout()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm mt-4">Оформить заказ</button>
        `;
      }
      updateBreadcrumbs(['Корзина']);
      window.navigateTo('cart');
    };

    window.updateCartQty = function(idx, delta) {
      window.appState.cart[idx].quantity += delta;
      if (window.appState.cart[idx].quantity <= 0) window.appState.cart.splice(idx, 1);
      updateCartBadge();
      renderCart();
    };

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      const count = window.appState.cart.reduce((s, i) => s + i.quantity, 0);
      badge.innerText = count;
      badge.classList.toggle('hidden', count === 0);
    }

    window.openCheckout = function() {
      document.getElementById('view-checkout').innerHTML = `
        <div class="bg-[#1c1d1e] p-4 rounded-xl border border-gray-800">
          <form onsubmit="submitOrder(event)" class="space-y-4">
            <div><label class="text-xs text-gray-400 block mb-1">Адрес</label><input type="text" id="o-addr" required class="w-full tg-input p-3 rounded-xl text-xs"></div>
            <div><label class="text-xs text-gray-400 block mb-1">Имя</label><input type="text" id="o-name" required value="${tgUser?.first_name || ''}" class="w-full tg-input p-3 rounded-xl text-xs"></div>
            <div><label class="text-xs text-gray-400 block mb-1">Телефон</label><input type="tel" id="o-phone" required class="w-full tg-input p-3 rounded-xl text-xs" placeholder="+375..."></div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm">Подтвердить заказ</button>
          </form>
        </div>
      `;
      updateBreadcrumbs(['Корзина', 'Оформление']);
      window.navigateTo('checkout');
    };

    window.submitOrder = function(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('o-name').value,
        phone: document.getElementById('o-phone').value,
        address: document.getElementById('o-addr').value,
        cart: window.appState.cart,
        total: window.appState.cart.reduce((s, i) => s + (i.price * i.quantity), 0)
      };
      if (tg && tg.sendData) tg.sendData(JSON.stringify(payload));
      else showToast('Заказ успешно оформлен!');
      window.appState.cart = [];
      updateCartBadge();
      renderUserCategories();
    };

    window.handleSearch = function() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      if (!q) return renderUserCategories();
      const results = [];
      window.appState.categories.forEach(c => (c.subcategories || []).forEach(s => (s.products || []).forEach(p => {
        if (p.title.toLowerCase().includes(q)) results.push(p);
      })));
      document.getElementById('view-search').innerHTML = results.map(prod => `
        <div onclick="openProductDetail('${prod.id}')" class="tg-card p-2.5 rounded-2xl flex flex-col justify-between cursor-pointer">
          <img src="${prod.image}" class="w-full h-28 object-cover rounded-xl mb-2" onerror="this.src='${FALLBACK_IMAGE}'">
          <h3 class="text-[11px] font-bold text-white line-clamp-2 mb-2">${prod.title}</h3>
          <span class="text-xs font-bold text-blue-400">${prod.price} Br</span>
        </div>
      `).join('') || `<div class="col-span-2 text-center py-10 text-gray-500 text-xs">Ничего не найдено</div>`;
      updateBreadcrumbs(['Поиск']);
      window.navigateTo('search');
    };

    // Админка
    window.toggleAdminModal = function() {
      const modal = document.getElementById('admin-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        adminLevel = 'categories';
        selectedAdminCatId = null;
        selectedAdminSubCatId = null;
        renderAdminList();
      } else {
        renderUserCategories();
      }
    };

    function refreshAdminView() {
      if (!document.getElementById('admin-modal').classList.contains('hidden')) renderAdminList();
    }

    function renderAdminList() {
      const container = document.getElementById('admin-list');
      const breadcrumbs = document.getElementById('admin-breadcrumbs');
      const addBtn = document.getElementById('admin-add-btn');

      if (adminLevel === 'categories') {
        breadcrumbs.innerHTML = `Категории`;
        addBtn.innerHTML = `<i class="fa-solid fa-folder-plus"></i> Добавить новую категорию`;
        container.innerHTML = window.appState.categories.map(cat => `
          <div class="bg-[#2a2b2c] p-2.5 rounded-xl flex items-center justify-between">
            <div onclick="enterAdminSubCategories('${cat.id}')" class="flex items-center gap-3 cursor-pointer flex-1">
              <img src="${cat.image}" class="w-10 h-10 rounded-lg object-cover" onerror="this.src='${FALLBACK_IMAGE}'">
              <div><h4 class="text-xs font-bold text-white">${cat.title}</h4><p class="text-[10px] text-gray-400">${(cat.subcategories || []).length} видов &gt;</p></div>
            </div>
            <button onclick="deleteCategory('${cat.id}')" class="w-8 h-8 bg-red-500/10 text-red-400 rounded-lg ml-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('') || `<div class="text-center text-gray-500 py-6 text-xs">Нет категорий</div>`;
      } else if (adminLevel === 'subcategories') {
        const cat = window.appState.categories.find(c => c.id === selectedAdminCatId);
        breadcrumbs.innerHTML = `<span onclick="setAdminLevel('categories')" class="cursor-pointer">Категории</span> &gt; ${cat?.title || ''}`;
        addBtn.innerHTML = `<i class="fa-solid fa-layer-group"></i> Добавить вид категории`;
        container.innerHTML = (cat?.subcategories || []).map(sub => `
          <div class="bg-[#2a2b2c] p-2.5 rounded-xl flex items-center justify-between">
            <div onclick="enterAdminProducts('${sub.id}')" class="flex items-center gap-3 cursor-pointer flex-1">
              <img src="${sub.image}" class="w-10 h-10 rounded-lg object-cover" onerror="this.src='${FALLBACK_IMAGE}'">
              <div><h4 class="text-xs font-bold text-white">${sub.title}</h4><p class="text-[10px] text-gray-400">${(sub.products || []).length} товаров &gt;</p></div>
            </div>
            <button onclick="deleteSubCategory('${sub.id}')" class="w-8 h-8 bg-red-500/10 text-red-400 rounded-lg ml-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('') || `<div class="text-center text-gray-500 py-6 text-xs">Нет видов</div>`;
      } else if (adminLevel === 'products') {
        const cat = window.appState.categories.find(c => c.id === selectedAdminCatId);
        const sub = cat?.subcategories?.find(s => s.id === selectedAdminSubCatId);
        breadcrumbs.innerHTML = `<span onclick="setAdminLevel('categories')">📁</span> &gt; <span onclick="setAdminLevel('subcategories')">${cat?.title || ''}</span> &gt; ${sub?.title || ''}`;
        addBtn.innerHTML = `<i class="fa-solid fa-box"></i> Добавить разновидность`;
        container.innerHTML = (sub?.products || []).map(prod => `
          <div class="bg-[#2a2b2c] p-2.5 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-3 flex-1">
              <img src="${prod.image}" class="w-10 h-10 rounded-lg object-cover" onerror="this.src='${FALLBACK_IMAGE}'">
              <div class="flex-1"><h4 class="text-[11px] font-bold text-white line-clamp-1">${prod.title}</h4><div class="text-[10px] text-blue-400 font-bold">${prod.price} Br</div></div>
            </div>
            <button onclick="deleteProduct('${prod.id}')" class="w-8 h-8 bg-red-500/10 text-red-400 rounded-lg ml-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join('') || `<div class="text-center text-gray-500 py-6 text-xs">Нет товаров</div>`;
      }
    }

    window.setAdminLevel = function(level) { adminLevel = level; renderAdminList(); };
    window.enterAdminSubCategories = function(catId) { selectedAdminCatId = catId; adminLevel = 'subcategories'; renderAdminList(); };
    window.enterAdminProducts = function(subCatId) { selectedAdminSubCatId = subCatId; adminLevel = 'products'; renderAdminList(); };

    window.deleteCategory = async function(catId) {
      if (confirm('Удалить категорию?')) {
        const backup = JSON.parse(JSON.stringify(window.appState.categories));
        window.appState.categories = window.appState.categories.filter(c => c.id !== catId);
        if (await saveToCloud()) renderAdminList(); else window.appState.categories = backup;
      }
    };
    window.deleteSubCategory = async function(subId) {
      if (confirm('Удалить вид?')) {
        const backup = JSON.parse(JSON.stringify(window.appState.categories));
        const cat = window.appState.categories.find(c => c.id === selectedAdminCatId);
        if (cat) {
          cat.subcategories = cat.subcategories.filter(s => s.id !== subId);
          if (await saveToCloud()) renderAdminList(); else window.appState.categories = backup;
        }
      }
    };
    window.deleteProduct = async function(prodId) {
      if (confirm('Удалить товар?')) {
        const backup = JSON.parse(JSON.stringify(window.appState.categories));
        const cat = window.appState.categories.find(c => c.id === selectedAdminCatId);
        const sub = cat?.subcategories?.find(s => s.id === selectedAdminSubCatId);
        if (sub) {
          sub.products = sub.products.filter(p => p.id !== prodId);
          if (await saveToCloud()) renderAdminList(); else window.appState.categories = backup;
        }
      }
    };

    window.openAddModal = function() {
      document.getElementById('form-title-input').value = '';
      document.getElementById('form-image-input').value = '';
      document.getElementById('form-price-input').value = '';
      document.getElementById('form-desc-input').value = '';
      document.getElementById('form-title').innerText = adminLevel === 'categories' ? 'Добавить категорию' : (adminLevel === 'subcategories' ? 'Добавить вид' : 'Добавить разновидность');
      document.getElementById('product-extra-fields').classList.toggle('hidden', adminLevel !== 'products');
      document.getElementById('form-modal').classList.remove('hidden');
    };

    window.closeFormModal = function() { document.getElementById('form-modal').classList.add('hidden'); };

    window.saveFormElement = async function() {
      const title = document.getElementById('form-title-input').value.trim();
      const image = document.getElementById('form-image-input').value.trim() || FALLBACK_IMAGE;
      if (!title) { showToast('Введите название!', 'error'); return; }

      const backup = JSON.parse(JSON.stringify(window.appState.categories));

      if (adminLevel === 'categories') {
        window.appState.categories.push({ id: 'cat_' + Date.now(), title, image, subcategories: [] });
      } else if (adminLevel === 'subcategories') {
        const cat = window.appState.categories.find(c => c.id === selectedAdminCatId);
        if (cat) cat.subcategories.push({ id: 'sub_' + Date.now(), title, image, products: [] });
      } else if (adminLevel === 'products') {
        const price = Number(document.getElementById('form-price-input').value) || 15;
        const description = document.getElementById('form-desc-input').value.trim();
        const cat = window.appState.categories.find(c => c.id === selectedAdminCatId);
        const sub = cat?.subcategories?.find(s => s.id === selectedAdminSubCatId);
        if (sub) sub.products.push({ id: 'prod_' + Date.now(), title, image, price, description });
      }

      if (await saveToCloud()) { closeFormModal(); renderAdminList(); } else { window.appState.categories = backup; }
    };

    window.onload = function() { initCloudSync(); };
  </script>
</body>
</html>
