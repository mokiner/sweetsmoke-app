<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VELIX</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body{
      background:#131415;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }
    .card{
      background:#1c1d1e;
      border-radius:16px;
      border:1px solid #2b2c2e;
    }
    .input{
      background:#242526;
      border:1px solid #333436;
      color:#fff;
    }
    .input:focus{
      outline:none;
      border-color:#2481cc;
    }
    .btn{
      background:#2481cc;
      color:#fff;
    }
    .btn:active{
      transform:scale(.98);
    }
    .hidden-view{ display:none; }
  </style>
</head>
<body class="pb-24">

<div class="max-w-md mx-auto min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-[#131415]/95 backdrop-blur border-b border-gray-800 p-3 flex items-center gap-2">
    <button id="backBtn" class="hidden text-blue-400 text-sm font-medium" onclick="goBack()">
      <i class="fa-solid fa-chevron-left"></i> Назад
    </button>

    <div id="breadcrumbs" class="text-xs text-gray-300 font-semibold truncate flex-1">
      Каталог
    </div>

    <button id="adminBtn" class="hidden text-xs px-3 py-2 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400 font-semibold" onclick="openAdmin()">
      <i class="fa-solid fa-gear mr-1"></i> Управление
    </button>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 p-3">

    <!-- SEARCH -->
    <div id="searchBox" class="relative mb-3">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
      <input id="searchInput" type="text" placeholder="Найти товар..." class="w-full input rounded-xl py-2 pl-9 pr-4 text-sm" oninput="searchProducts()" />
    </div>

    <!-- VIEWS -->
    <div id="viewCategories" class="grid grid-cols-2 gap-3"></div>
    <div id="viewSubcategories" class="hidden-view grid grid-cols-2 gap-3"></div>
    <div id="viewProducts" class="hidden-view grid grid-cols-2 gap-3"></div>
    <div id="viewDetail" class="hidden-view"></div>
    <div id="viewCart" class="hidden-view"></div>
    <div id="viewSearch" class="hidden-view grid grid-cols-2 gap-3"></div>
  </main>

  <!-- NAV -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1a1b1c] border-t border-gray-800 px-2 py-2 flex justify-around text-xs text-gray-400 z-40">
    <button onclick="renderCategories()" class="flex flex-col items-center gap-1 text-blue-400">
      <i class="fa-solid fa-border-all text-base"></i><span>Каталог</span>
    </button>

    <button onclick="showView('viewSearch')" class="flex flex-col items-center gap-1">
      <i class="fa-solid fa-magnifying-glass text-base"></i><span>Поиск</span>
    </button>

    <button onclick="renderCart()" class="flex flex-col items-center gap-1 relative">
      <i class="fa-solid fa-cart-shopping text-base"></i><span>Корзина</span>
      <span id="cartBadge" class="hidden absolute -top-1 right-1 bg-blue-500 text-white rounded-full text-[10px] w-4 h-4 flex items-center justify-center">0</span>
    </button>
  </nav>
</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur p-4">
  <div class="card max-w-md mx-auto h-full p-4 flex flex-col">
    <div class="flex items-center justify-between mb-3 border-b border-gray-800 pb-2">
      <h2 class="font-bold">Управление каталогом</h2>
      <button onclick="closeAdmin()" class="text-xl text-gray-400">&times;</button>
    </div>

    <div id="adminList" class="flex-1 overflow-y-auto space-y-2"></div>

    <div class="pt-3 border-t border-gray-800 flex gap-2">
      <button onclick="addCategory()" class="flex-1 btn py-3 rounded-xl text-sm font-bold">
        <i class="fa-solid fa-plus mr-1"></i> Добавить категорию
      </button>
      <button onclick="closeAdmin()" class="px-4 py-3 rounded-xl bg-gray-800 text-sm">Закрыть</button>
    </div>
  </div>
</div>

<script>
/* ---------------- TELEGRAM ---------------- */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.expand();
}

/* ---------------- ADMIN ---------------- */
const ADMIN_USERS = ['beerezka0','mokiner'];
const username = (tg?.initDataUnsafe?.user?.username || '').toLowerCase();
const isAdmin = ADMIN_USERS.includes(username);

if (isAdmin) {
  document.getElementById('adminBtn').classList.remove('hidden');
}

/* ---------------- STORAGE ---------------- */
const STORAGE_KEY = 'velix_catalog_v1';

const defaultCatalog = [
  {
    id: 'cat_chew',
    title: 'Жевательные смеси',
    image: 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=600&auto=format&fit=crop&q=80',
    subcategories: [
      {
        id: 'sub_glitch',
        title: 'Glitch',
        image: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600&auto=format&fit=crop&q=80',
        products: [
          {
            id: 'prod_glitch_150',
            title: 'Glitch 150mg',
            price: 13,
            image: 'https://images.unsplash.com/photo-1560807707-8cc77767d783?w=600&auto=format&fit=crop&q=80',
            description: 'Мощная жевательная смесь.'
          }
        ]
      }
    ]
  }
];

function loadCatalog(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return structuredClone(defaultCatalog);

  try{
    return JSON.parse(raw);
  }catch{
    return structuredClone(defaultCatalog);
  }
}

function saveCatalog(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.categories));
}

/* ---------------- STATE ---------------- */
const state = {
  categories: loadCatalog(),
  cart: [],
  currentView: 'viewCategories',
  selectedCategory: null,
  selectedSubcategory: null,
  selectedProduct: null
};

/* ---------------- HELPERS ---------------- */
function setBreadcrumbs(items){
  document.getElementById('breadcrumbs').innerHTML = items.join(' <span class="text-gray-600">></span> ');
}

function showView(id){
  ['viewCategories','viewSubcategories','viewProducts','viewDetail','viewCart','viewSearch']
    .forEach(v => document.getElementById(v).classList.add('hidden-view'));

  document.getElementById(id).classList.remove('hidden-view');
  state.currentView = id;

  document.getElementById('backBtn').classList.toggle('hidden', id === 'viewCategories');

  document.getElementById('searchBox').classList.toggle('hidden',
    id === 'viewDetail' || id === 'viewCart');
}

/* ---------------- CATALOG ---------------- */
function renderCategories(){
  state.selectedCategory = null;
  state.selectedSubcategory = null;

  const el = document.getElementById('viewCategories');

  el.innerHTML = state.categories.map(cat => `
    <div class="card p-3 cursor-pointer" onclick="openCategory('${cat.id}')">
      <img src="${cat.image}" class="w-full h-32 object-cover rounded-xl mb-2" loading="lazy">
      <div class="text-sm font-semibold text-center">${cat.title}</div>
    </div>
  `).join('');

  setBreadcrumbs(['Каталог']);
  showView('viewCategories');
}

function openCategory(id){
  const cat = state.categories.find(c => c.id === id);
  if (!cat) return;

  state.selectedCategory = cat;

  const el = document.getElementById('viewSubcategories');

  el.innerHTML = cat.subcategories.map(sub => `
    <div class="card p-3 cursor-pointer" onclick="openSubcategory('${sub.id}')">
      <img src="${sub.image}" class="w-full h-32 object-cover rounded-xl mb-2" loading="lazy">
      <div class="text-sm font-semibold text-center">${sub.title}</div>
    </div>
  `).join('');

  setBreadcrumbs(['Каталог', cat.title]);
  showView('viewSubcategories');
}

function openSubcategory(id){
  const sub = state.selectedCategory.subcategories.find(s => s.id === id);
  if (!sub) return;

  state.selectedSubcategory = sub;

  const el = document.getElementById('viewProducts');

  el.innerHTML = sub.products.map(prod => `
    <div class="card p-3 flex flex-col">
      <div onclick="openProduct('${prod.id}')" class="cursor-pointer">
        <img src="${prod.image}" class="w-full h-32 object-cover rounded-xl mb-2" loading="lazy">
        <div class="text-sm font-semibold leading-tight min-h-[38px]">${prod.title}</div>
      </div>

      <div class="mt-3 flex items-center justify-between">
        <span class="font-bold text-sm">${prod.price} Br</span>

        <!-- КНОПКА БОЛЬШЕ НЕ ПРОПАДАЕТ -->
        <button type="button"
                onclick="event.stopPropagation(); quickAdd('${prod.id}')"
                class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0">
          <i class="fa-solid fa-cart-shopping text-xs"></i>
        </button>
      </div>
    </div>
  `).join('');

  setBreadcrumbs(['Каталог', state.selectedCategory.title, sub.title]);
  showView('viewProducts');
}

function openProduct(id){
  const prod = state.selectedSubcategory.products.find(p => p.id === id);
  if (!prod) return;

  state.selectedProduct = prod;

  document.getElementById('viewDetail').innerHTML = `
    <div class="space-y-4">
      <img src="${prod.image}" class="w-full h-72 object-cover rounded-2xl" loading="lazy">

      <div>
        <h1 class="text-xl font-bold">${prod.title}</h1>
        <p class="text-sm text-gray-400 mt-2">${prod.description || ''}</p>
      </div>

      <button class="w-full btn py-4 rounded-2xl font-bold flex items-center justify-between px-4" onclick="addToCart(state.selectedProduct)">
        <span>Добавить в корзину</span>
        <span>${prod.price} Br</span>
      </button>
    </div>
  `;

  setBreadcrumbs(['Каталог', state.selectedCategory.title, state.selectedSubcategory.title, prod.title]);
  showView('viewDetail');
}

/* ---------------- CART ---------------- */
function quickAdd(id){
  const prod = state.selectedSubcategory.products.find(p => p.id === id);
  if (prod) addToCart(prod);
}

function addToCart(prod){
  const item = state.cart.find(i => i.id === prod.id);

  if (item) item.qty++;
  else state.cart.push({...prod, qty:1});

  updateCartBadge();
}

function updateCartBadge(){
  const badge = document.getElementById('cartBadge');
  const count = state.cart.reduce((s,i)=>s+i.qty,0);

  if (count){
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function renderCart(){
  const el = document.getElementById('viewCart');

  if (!state.cart.length){
    el.innerHTML = `
      <div class="text-center py-16 text-gray-500">
        <i class="fa-solid fa-cart-shopping text-4xl mb-3"></i>
        <p>Корзина пуста</p>
      </div>
    `;
  } else {
    const total = state.cart.reduce((s,i)=>s+i.price*i.qty,0);

    el.innerHTML = `
      <div class="space-y-3">
        ${state.cart.map((item,idx)=>`
          <div class="card p-3 flex items-center gap-3">
            <img src="${item.image}" class="w-14 h-14 object-cover rounded-lg">

            <div class="flex-1">
              <div class="font-semibold text-sm">${item.title}</div>
              <div class="text-xs text-gray-400">${item.price} Br</div>
            </div>

            <div class="flex items-center gap-2 bg-gray-800 rounded-lg px-2 py-1">
              <button onclick="changeQty(${idx},-1)" class="w-6 h-6">-</button>
              <span class="text-sm font-bold">${item.qty}</span>
              <button onclick="changeQty(${idx},1)" class="w-6 h-6">+</button>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="mt-4 border-t border-gray-800 pt-4 flex justify-between font-bold">
        <span>Итого</span>
        <span>${total} Br</span>
      </div>

      <button class="w-full btn py-3 rounded-xl font-bold mt-4" onclick="sendOrder()">
        Оформить заказ
      </button>
    `;
  }

  setBreadcrumbs(['Каталог','Корзина']);
  showView('viewCart');
}

function changeQty(idx, delta){
  state.cart[idx].qty += delta;

  if (state.cart[idx].qty <= 0){
    state.cart.splice(idx,1);
  }

  updateCartBadge();
  renderCart();
}

function sendOrder(){
  const total = state.cart.reduce((s,i)=>s+i.price*i.qty,0);

  const payload = {
    user: username,
    items: state.cart,
    total
  };

  if (tg?.sendData){
    tg.sendData(JSON.stringify(payload));
  }

  alert('Заказ отправлен!');
  state.cart = [];
  updateCartBadge();
  renderCategories();
}

/* ---------------- SEARCH ---------------- */
function searchProducts(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  if (!q){
    renderCategories();
    return;
  }

  const results = [];

  state.categories.forEach(cat=>{
    cat.subcategories.forEach(sub=>{
      sub.products.forEach(prod=>{
        if (prod.title.toLowerCase().includes(q)){
          results.push(prod);
        }
      });
    });
  });

  document.getElementById('viewSearch').innerHTML = results.map(prod=>`
    <div class="card p-3 cursor-pointer" onclick="openSearchProduct('${prod.id}')">
      <img src="${prod.image}" class="w-full h-28 object-cover rounded-xl mb-2" loading="lazy">
      <div class="text-sm font-semibold leading-tight min-h-[38px]">${prod.title}</div>
      <div class="text-blue-400 font-bold mt-2 text-sm">${prod.price} Br</div>
    </div>
  `).join('');

  setBreadcrumbs(['Каталог','Поиск']);
  showView('viewSearch');
}

function openSearchProduct(id){
  for (const cat of state.categories){
    for (const sub of cat.subcategories){
      const prod = sub.products.find(p=>p.id===id);
      if (prod){
        state.selectedCategory = cat;
        state.selectedSubcategory = sub;
        openProduct(id);
        return;
      }
    }
  }
}

/* ---------------- ADMIN ---------------- */
function openAdmin(){
  renderAdmin();
  document.getElementById('adminModal').classList.remove('hidden');
}

function closeAdmin(){
  document.getElementById('adminModal').classList.add('hidden');
}

function renderAdmin(){
  const el = document.getElementById('adminList');

  el.innerHTML = state.categories.map(cat=>`
    <div class="card p-3 space-y-3">
      <div class="flex items-center gap-3">
        <img src="${cat.image}" class="w-12 h-12 rounded-lg object-cover">
        <div class="flex-1">
          <div class="font-semibold text-sm">${cat.title}</div>
          <div class="text-xs text-gray-400">${cat.subcategories.length} видов</div>
        </div>
        <button onclick="deleteCategory('${cat.id}')" class="text-red-400 text-xs">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>

      <button onclick="addProduct('${cat.id}')" class="w-full py-2 rounded-lg bg-blue-600 text-sm font-semibold">
        + Добавить товар
      </button>
    </div>
  `).join('');
}

function addCategory(){
  const title = prompt('Название категории');
  if (!title) return;

  state.categories.push({
    id:'cat_'+Date.now(),
    title,
    image:'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=600&auto=format&fit=crop&q=80',
    subcategories:[]
  });

  saveCatalog();
  renderAdmin();
  renderCategories();
}

function addProduct(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if (!cat) return;

  const title = prompt('Название товара');
  if (!title) return;

  const price = Number(prompt('Цена (Br)','13')) || 13;

  let sub = cat.subcategories[0];

  if (!sub){
    sub = {
      id:'sub_'+Date.now(),
      title:'Основные',
      image:'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600&auto=format&fit=crop&q=80',
      products:[]
    };
    cat.subcategories.push(sub);
  }

  sub.products.push({
    id:'prod_'+Date.now(),
    title,
    price,
    image:'https://images.unsplash.com/photo-1560807707-8cc77767d783?w=600&auto=format&fit=crop&q=80',
    description:''
  });

  saveCatalog();
  renderAdmin();
  renderCategories();
}

function deleteCategory(id){
  if (!confirm('Удалить категорию?')) return;

  state.categories = state.categories.filter(c=>c.id!==id);

  saveCatalog();
  renderAdmin();
  renderCategories();
}

/* ---------------- BACK ---------------- */
function goBack(){
  if (state.currentView === 'viewSubcategories') return renderCategories();
  if (state.currentView === 'viewProducts') return openCategory(state.selectedCategory.id);
  if (state.currentView === 'viewDetail') return openSubcategory(state.selectedSubcategory.id);
  renderCategories();
}

/* ---------------- START ---------------- */
renderCategories();
updateCartBadge();
</script>

</body>
</html>
