<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VELIX — Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #050505;
  --bg-card: #0f0f0f;
  --bg-card-hover: #161616;
  --surface: #141414;
  --surface-light: #1c1c1c;
  --border: #2a2a2a;
  --text: #e8e8e8;
  --text-secondary: #999;
  --text-muted: #666;
  --accent: #00e600;
  --accent-dark: #00b300;
  --accent-glow: rgba(0, 230, 0, 0.15);
  --danger: #ff3333;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
}

.app-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 40%, rgba(0,180,0,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 80% 80%, rgba(0,200,0,0.05) 0%, transparent 50%),
    radial-gradient(circle at 50% 0%, rgba(0,255,0,0.03) 0%, transparent 50%),
    repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(0,255,0,0.015) 35px, rgba(0,255,0,0.015) 70px),
    var(--bg);
}

.app-container {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
}

.header {
  padding: 12px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.8) 100%);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title {
  font-family: 'Oswald', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(0,230,0,0.3);
}
.header-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.header-btn:hover { background: var(--surface-light); border-color: var(--accent); color: var(--accent); }
.header-btn svg { width: 16px; height: 16px; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 90px;
  scroll-behavior: smooth;
}
.content::-webkit-scrollbar { width: 0; }

.search-box {
  position: relative;
  margin-bottom: 16px;
}
.search-box input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--text-muted); }
.search-box svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-muted);
}

.section-title {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title span { color: var(--accent); }

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 20px var(--accent-glow); }
.card-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: #1a1a1a;
}
.card-body { padding: 12px; }
.card-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.card-price {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'Oswald', sans-serif;
}
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-icon:hover { border-color: var(--accent); color: var(--accent); }
.btn-icon svg { width: 18px; height: 18px; }

.cat-card .card-img { aspect-ratio: 1.1; }
.cat-card .card-title { text-align: center; font-family: 'Oswald', sans-serif; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

.pd-img {
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 16px;
  border: 1px solid var(--border);
}
.pd-title {
  font-family: 'Oswald', sans-serif;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  line-height: 1.2;
}
.pd-desc {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 16px;
}
.pd-price {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'Oswald', sans-serif;
  margin-bottom: 16px;
}
.pd-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.btn-primary {
  flex: 1;
  padding: 14px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover { background: var(--accent-dark); box-shadow: 0 0 20px var(--accent-glow); }
.btn-secondary {
  flex: 1;
  padding: 14px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

.cart-item {
  display: flex;
  gap: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
  align-items: center;
}
.cart-item img {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: var(--radius-xs);
  flex-shrink: 0;
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cart-item-price { font-size: 15px; color: var(--accent); font-weight: 700; font-family: 'Oswald', sans-serif; }
.cart-qty {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-radius: var(--radius-xs);
  padding: 4px;
}
.cart-qty button {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}
.cart-qty button:hover { background: var(--surface-light); }
.cart-qty span { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
.cart-delete {
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  color: var(--danger);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
}
.cart-delete:hover { background: rgba(255,51,51,0.1); }

.cart-summary {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 8px;
}
.cart-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 15px;
}
.cart-row.total {
  font-size: 18px;
  font-weight: 700;
  font-family: 'Oswald', sans-serif;
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 10px;
}
.cart-row.total span { color: var(--accent); }

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }

.delivery-toggle {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.delivery-toggle button {
  flex: 1;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
.delivery-toggle button.active { background: var(--accent); color: #000; border-color: var(--accent); }

.admin-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 10px;
}
.admin-item img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: var(--radius-xs);
  flex-shrink: 0;
}
.admin-item-info { flex: 1; min-width: 0; }
.admin-item-title { font-size: 15px; font-weight: 600; }
.admin-item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.admin-item-actions { display: flex; gap: 8px; }

.btn-danger {
  padding: 8px 14px;
  background: rgba(255,51,51,0.1);
  color: var(--danger);
  border: 1px solid rgba(255,51,51,0.3);
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-danger:hover { background: rgba(255,51,51,0.2); }
.btn-success {
  padding: 8px 14px;
  background: rgba(0,230,0,0.1);
  color: var(--accent);
  border: 1px solid rgba(0,230,0,0.3);
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px 16px 30px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.active .modal { transform: translateY(0); }
.modal-title {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
  text-align: center;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: linear-gradient(0deg, rgba(5,5,5,0.98) 0%, rgba(5,5,5,0.9) 100%);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  padding: 4px 12px;
  transition: color 0.2s;
  position: relative;
}
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 24px; height: 24px; }
.nav-badge {
  position: absolute;
  top: 0;
  right: 4px;
  background: var(--accent);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty p { font-size: 15px; }

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.breadcrumb span { cursor: pointer; transition: color 0.2s; }
.breadcrumb span:hover { color: var(--accent); }
.breadcrumb .current { color: var(--text); font-weight: 600; }

.profile-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
}
.profile-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  font-family: 'Oswald', sans-serif;
  font-size: 32px;
  color: var(--accent);
}
.profile-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.profile-role { font-size: 13px; color: var(--accent); font-weight: 600; }

.fav-btn.active svg { fill: var(--danger); stroke: var(--danger); }

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--surface-light);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  z-index: 300;
  transition: transform 0.3s;
  pointer-events: none;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.toast.show { transform: translateX(-50%) translateY(0); }

.hidden { display: none !important; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.3s ease; }
</style>
</head>
<body>
<div class="app-bg"></div>
<div class="app-container">

  <!-- Header -->
  <div class="header" id="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="header-btn hidden" id="backBtn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Назад
      </button>
      <div class="header-title" id="pageTitle">VELIX</div>
    </div>
    <button class="header-btn hidden" id="adminBtn" onclick="openAdmin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.67 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l.06.06A1.65 1.65 0 0 0 9 4.67a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Управление
    </button>
  </div>

  <!-- Content -->
  <div class="content" id="content"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item active" data-page="catalog" onclick="navigate('catalog')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Каталог
    </button>
    <button class="nav-item" data-page="search" onclick="navigate('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Найти
    </button>
    <button class="nav-item" data-page="cart" onclick="navigate('cart')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Корзина
      <span class="nav-badge hidden" id="cartBadge">0</span>
    </button>
    <button class="nav-item" data-page="favorites" onclick="navigate('favorites')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Избранное
    </button>
    <button class="nav-item" data-page="profile" onclick="navigate('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModalOnOutside(event)">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
// ================= TELEGRAM & AUTH SETUP =================
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.enableClosingConfirmation(); }

const ADMIN_USERS = ['beerezka0', 'mokiner'];
const tgUser = tg?.initDataUnsafe?.user;
let currentUsername = (tgUser?.username || '').replace('@', '').trim().toLowerCase();

// Тестирование с ПК через ?admin=1
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('admin') === '1') currentUsername = 'beerezka0';

const isAdmin = ADMIN_USERS.map(u => u.toLowerCase()).includes(currentUsername);

let state = {
  page: 'catalog',
  subPage: null,
  categoryId: null,
  typeId: null,
  productId: null,
  cart: [],
  favorites: [],

function loadData() {
  const c = localStorage.getItem('velix_cats');
  const t = localStorage.getItem('velix_types');
  const p = localStorage.getItem('velix_prods');
  const cart = localStorage.getItem('velix_cart');
  const favs = localStorage.getItem('velix_favs');
  const ord = localStorage.getItem('velix_orders');
  if (c) storeData.categories = JSON.parse(c);
  if (t) storeData.types = JSON.parse(t);
  if (p) storeData.products = JSON.parse(p);
  if (cart) state.cart = JSON.parse(cart);
  if (favs) state.favorites = JSON.parse(favs);
  if (ord) state.orders = JSON.parse(ord);
}

function saveData() {
  localStorage.setItem('velix_cats', JSON.stringify(storeData.categories));
  localStorage.setItem('velix_types', JSON.stringify(storeData.types));
  localStorage.setItem('velix_prods', JSON.stringify(storeData.products));
  localStorage.setItem('velix_cart', JSON.stringify(state.cart));
  localStorage.setItem('velix_favs', JSON.stringify(state.favorites));
  localStorage.setItem('velix_orders', JSON.stringify(state.orders));
}

// ================= NAVIGATION =================
function navigate(page, pushState = true) {
  if (pushState) {
    state.navStack.push({ page: state.page, subPage: state.subPage, categoryId: state.categoryId, typeId: state.typeId, productId: state.productId });
  }
  state.page = page;
  state.subPage = null;
  state.categoryId = null;
  state.typeId = null;
  state.productId = null;
  render();
}

function goBack() {
  const prev = state.navStack.pop();
  if (prev) {
    state.page = prev.page;
    state.subPage = prev.subPage;
    state.categoryId = prev.categoryId;
    state.typeId = prev.typeId;
    state.productId = prev.productId;
  } else {
    state.subPage = null;
    state.categoryId = null;
    state.typeId = null;
    state.productId = null;
  }
  render();
}

function openCategory(catId) {
  state.navStack.push({ page: state.page, subPage: state.subPage, categoryId: state.categoryId, typeId: state.typeId, productId: state.productId });
  state.subPage = 'types';
  state.categoryId = catId;
  render();
}

function openType(typeId) {
  state.navStack.push({ page: state.page, subPage: state.subPage, categoryId: state.categoryId, typeId: state.typeId, productId: state.productId });
  state.subPage = 'products';
  state.typeId = typeId;
  render();
}

function openProduct(prodId) {
  state.navStack.push({ page: state.page, subPage: state.subPage, categoryId: state.categoryId, typeId: state.typeId, productId: state.productId });
  state.subPage = 'product';
  state.productId = prodId;
  render();
}

// ================= RENDER =================
function render() {
  const content = document.getElementById('content');
  const title = document.getElementById('pageTitle');
  const backBtn = document.getElementById('backBtn');
  const adminBtn = document.getElementById('adminBtn');

  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === state.page));

  adminBtn.classList.toggle('hidden', !(state.page === 'catalog' && state.subPage === null && isAdmin));

  if (state.subPage) {
    backBtn.classList.remove('hidden');
    title.textContent = state.page === 'catalog' ? 'Каталог' : 'VELIX';
  } else {
    backBtn.classList.add('hidden');
    title.textContent = state.page === 'catalog' ? 'Каталог' :
                        state.page === 'search' ? 'Поиск' :
                        state.page === 'cart' ? 'Корзина' :
                        state.page === 'favorites' ? 'Избранное' :
                        state.page === 'profile' ? 'Профиль' : 'VELIX';
  }

  content.innerHTML = '';
  switch (state.page) {
    case 'catalog': renderCatalog(content); break;
    case 'search': renderSearch(content); break;
    case 'cart':
      if (state.subPage === 'checkout') renderCheckout(content);
      else renderCart(content);
      break;
    case 'favorites': renderFavorites(content); break;
    case 'profile': renderProfile(content); break;
    default: renderCatalog(content);
  }

  updateCartBadge();
}

// ----- CATALOG -----
function renderCatalog(content) {
  if (state.subPage === 'types') { renderTypes(content); return; }
  if (state.subPage === 'products') { renderProducts(content); return; }
  if (state.subPage === 'product') { renderProductDetail(content); return; }

  const searchDiv = document.createElement('div');
  searchDiv.className = 'search-box';
  searchDiv.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Поиск категорий..." oninput="filterCatalog(this.value)">
  `;
  content.appendChild(searchDiv);

  const grid = document.createElement('div');
  grid.className = 'grid-2 fade-in';
  grid.id = 'catGrid';
  storeData.categories.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'card cat-card';
    card.onclick = () => openCategory(cat.id);
    card.innerHTML = `
      <img src="${cat.image}" class="card-img" alt="${cat.name}" onerror="this.src='https://images.unsplash.com/photo-1534067783941-51c97027f385?w=300'">
      <div class="card-body">
        <div class="card-title">${cat.name}</div>
      </div>
    `;
    grid.appendChild(card);
  });
  content.appendChild(grid);
}

function filterCatalog(q) {
  const grid = document.getElementById('catGrid');
  if (!grid) return;
  grid.querySelectorAll('.cat-card').forEach(item => {
    const name = item.querySelector('.card-title').textContent.toLowerCase();
    item.style.display = name.includes(q.toLowerCase()) ? '' : 'none';
  });
}

function renderTypes(content) {
  const cat = storeData.categories.find(c => c.id === state.categoryId);
  if (!cat) return;

  const breadcrumb = document.createElement('div');
  breadcrumb.className = 'breadcrumb';
  breadcrumb.innerHTML = `<span onclick="goBack()">Каталог</span> <span>›</span> <span class="current">${cat.name}</span>`;
  content.appendChild(breadcrumb);

  const types = storeData.types.filter(t => t.categoryId === state.categoryId);
  if (types.length === 0) {
    content.innerHTML += `<div class="empty"><p>В этой категории пока нет видов</p></div>`;
    return;
  }

  const grid = document.createElement('div');

  types.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card cat-card';
    card.onclick = () => openType(t.id);
    card.innerHTML = `
      <img src="${t.image}" class="card-img" alt="${t.name}" onerror="this.src='https://images.unsplash.com/photo-1534067783941-51c97027f385?w=300'">
      <div class="card-body">
        <div class="card-title">${t.name}</div>
      </div>

  content.appendChild(grid);

          <button class="btn-icon fav-btn ${inFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">

// ----- SEARCH -----
function renderSearch(content) {
  const searchDiv = document.createElement('div');
  searchDiv.className = 'search-box';
  searchDiv.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Найти товар..." oninput="doSearch(this.value)">
  `;
  content.appendChild(searchDiv);

  const results = document.createElement('div');
  results.className = 'grid-2 fade-in';
  results.id = 'searchResults';
  content.appendChild(results);
}

function doSearch(q) {
  const grid = document.getElementById('searchResults');
  if (!grid) return;
  if (!q.trim()) { grid.innerHTML = ''; return; }
  const prods = storeData.products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
  grid.innerHTML = '';
  if (prods.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><p>Ничего не найдено</p></div>`;
    return;
  }
  prods.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => { state.page = 'catalog'; state.subPage = 'product'; state.productId = p.id; render(); };
    card.innerHTML = `
      <img src="${p.image}" class="card-img" alt="${p.name}">
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-price">${p.price} Br</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ----- CART & CHECKOUT -----
function renderCart(content) {
  if (state.cart.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <p>Корзина пуста</p>
      </div>
    `;
    return;
  }

  state.cart.forEach(item => {
    const p = storeData.products.find(x => x.id === item.id);
    if (!p) return;
    const div = document.createElement('div');
    div.className = 'cart-item fade-in';
    div.innerHTML = `
      <img src="${p.image}" alt="${p.name}">
      <div class="cart-item-info">
        <div class="cart-item-title">${p.name}</div>
        <div class="cart-item-price">${p.price} Br</div>
      </div>
      <div class="cart-qty">
        <button onclick="changeQty('${item.id}', -1)">−</button>
        <span>${item.qty}</span>
        <button onclick="changeQty('${item.id}', 1)">+</button>
      </div>
      <button class="cart-delete" onclick="removeFromCart('${item.id}')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    `;
    content.appendChild(div);
  });

  const total = state.cart.reduce((sum, item) => {
    const p = storeData.products.find(x => x.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);

  const summary = document.createElement('div');
  summary.className = 'cart-summary fade-in';
  summary.innerHTML = `
    <div class="cart-row"><span>Товары</span><span>${total} Br</span></div>
    <div class="cart-row total"><span>Итого</span><span>${total} Br</span></div>
    <button class="btn-primary" style="width:100%;margin-top:14px;" onclick="openCheckout()">Оформить заказ</button>
  `;
  content.appendChild(summary);
}

function openCheckout() {
  state.subPage = 'checkout';
  render();
}

function renderCheckout(content) {
  const total = state.cart.reduce((sum, item) => {
    const p = storeData.products.find(x => x.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);

  content.innerHTML = `
    <div class="fade-in">
      <div class="delivery-toggle">
        <button class="active" id="delDelivery" onclick="setDelivery(true)">Доставка</button>
        <button id="delPickup" onclick="setDelivery(false)">Самовывоз</button>
      </div>
      <div class="form-group"><label>Адрес</label><input type="text" id="chkAddr" placeholder="Город, улица, дом"></div>
      <div class="form-group"><label>Имя</label><input type="text" id="chkName" value="${tgUser?.first_name || ''}" placeholder="Ваше имя"></div>
      <div class="form-group"><label>Телефон</label><input type="tel" id="chkPhone" placeholder="+375..."></div>
      <div class="form-group"><label>Комментарий</label><textarea id="chkComment" placeholder="Примечания к заказу..."></textarea></div>
      <div class="cart-summary" style="margin-top:20px;">
        <div class="cart-row total"><span>К оплате</span><span>${total} Br</span></div>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:16px;" onclick="submitOrder()">Подтвердить заказ</button>
    </div>
  `;
}

function setDelivery(isDelivery) {
  document.getElementById('delDelivery').classList.toggle('active', isDelivery);
  document.getElementById('delPickup').classList.toggle('active', !isDelivery);
}

function submitOrder() {
  const name = document.getElementById('chkName').value.trim();
  const phone = document.getElementById('chkPhone').value.trim();
  const address = document.getElementById('chkAddr').value.trim();
  if (!name || !phone) { showToast('Заполните имя и телефон'); return; }

  const newOrder = {
    id: 'ord_' + Date.now(),
    name, phone, address,
    username: state.user.username,
    items: [...state.cart],
    total: state.cart.reduce((s, i) => {
      const p = storeData.products.find(x => x.id === i.id);
      return s + (p ? p.price * i.qty : 0);
    }, 0),
    date: new Date().toLocaleString()
  };

  state.orders.push(newOrder);
  state.cart = [];
  saveData();
  showToast('Заказ успешно оформлен!');
  if (tg && tg.sendData) tg.sendData(JSON.stringify(newOrder));
  state.subPage = null;
  state.page = 'catalog';
  render();
}

        <div class="card-actions">
          <button class="btn-icon" onclick="event.stopPropagation(); addToCart('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></button>
          <button class="btn-icon fav-btn active" onclick="event.stopPropagation(); toggleFav('${p.id}')"><svg viewBox="0 0 24 24" fill="#ff3333" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
  content.appendChild(grid);
}

function renderProfile(content) {
  content.innerHTML = `
    <div class="fade-in">
      <div class="profile-card">
        <div class="profile-avatar">${state.user.name.charAt(0)}</div>
        <div class="profile-name">${state.user.name}</div>
        <div class="profile-role">${state.user.username}</div>
      </div>
      ${isAdmin ? `
        <button class="btn-primary" style="width:100%;margin-bottom:12px;" onclick="openAdmin()">
          Панель управления
        </button>
      ` : ''}
    </div>
  `;
}

// ================= CART UTILS =================
function addToCart(id) {
  const item = state.cart.find(x => x.id === id);
  if (item) item.qty += 1;
  else state.cart.push({ id, qty: 1 });
  saveData();
  updateCartBadge();
  showToast('Товар добавлен в корзину');
}

function changeQty(id, delta) {
  const item = state.cart.find(x => x.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) state.cart = state.cart.filter(x => x.id !== id);
  saveData();
  render();
}

function removeFromCart(id) {
  state.cart = state.cart.filter(x => x.id !== id);
  saveData();
  render();
}

function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  const count = state.cart.reduce((s, i) => s + i.qty, 0);
  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function toggleFav(id) {
  if (state.favorites.includes(id)) {
    state.favorites = state.favorites.filter(x => x !== id);
    showToast('Удалено из избранного');
  } else {
    state.favorites.push(id);
    showToast('Добавлено в избранное');
  }
  saveData();
  render();
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ================= ADMIN PANEL =================
function openAdmin() {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  modal.classList.add('active');
  renderAdminCategoriesModal(content);
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  render();
}

function closeModalOnOutside(e) {
  if (e.target.id === 'modal') closeModal();
}

function renderAdminCategoriesModal(container) {
  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="modal-title" style="margin:0;">Управление категориями</div>
      <button class="header-btn" onclick="openAdminOrders()">Заказы (${state.orders.length})</button>
    </div>
    <div id="adminList"></div>
    <button class="btn-primary" style="width:100%;margin-top:16px;" onclick="promptAddCategory()">+ Добавить категорию</button>
  `;
  const list = document.getElementById('adminList');
  storeData.categories.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'admin-item';
    div.innerHTML = `
      <img src="${cat.image}" alt="${cat.name}" onerror="this.src='https://images.unsplash.com/photo-1534067783941-51c97027f385?w=300'">
      <div class="admin-item-info">
        <div class="admin-item-title">${cat.name}</div>
        <div class="admin-item-sub">Видов: ${storeData.types.filter(t => t.categoryId === cat.id).length}</div>
      </div>
      <div class="admin-item-actions">
        <button class="btn-success" onclick="openAdminTypesModal('${cat.id}')">Виды</button>
        <button class="btn-danger" onclick="deleteCategory('${cat.id}')">Удалить</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function promptAddCategory() {
  const name = prompt('Введите название новой категории:');
  if (!name) return;
  const image = prompt('Введите URL картинки:', 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400');
  storeData.categories.push({ id: 'cat_' + Date.now(), name, image: image || 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400' });
  saveData();
  renderAdminCategoriesModal(document.getElementById('modalContent'));
  showToast('Категория добавлена');
}

function deleteCategory(id) {
  if (!confirm('Удалить категорию?')) return;
  storeData.categories = storeData.categories.filter(c => c.id !== id);
  storeData.types.filter(t => t.categoryId === id).forEach(t => {
    storeData.products = storeData.products.filter(p => p.typeId !== t.id);
  });
  storeData.types = storeData.types.filter(t => t.categoryId !== id);
  saveData();
  renderAdminCategoriesModal(document.getElementById('modalContent'));
  showToast('Категория удалена');
}

function openAdminTypesModal(catId) {
  const cat = storeData.categories.find(c => c.id === catId);
  const container = document.getElementById('modalContent');
  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <button class="header-btn" onclick="openAdmin()">< Назад</button>
      <div class="modal-title" style="margin:0;">Виды: ${cat.name}</div>
    </div>
    <div id="adminTypeList"></div>
    <button class="btn-primary" style="width:100%;margin-top:16px;" onclick="promptAddType('${catId}')">+ Добавить вид</button>
  `;
  const list = document.getElementById('adminTypeList');
  storeData.types.filter(t => t.categoryId === catId).forEach(t => {
    const div = document.createElement('div');
    div.className = 'admin-item';
    div.innerHTML = `
      <img src="${t.image}" alt="${t.name}" onerror="this.src='https://images.unsplash.com/photo-1534067783941-51c97027f385?w=300'">
      <div class="admin-item-info">
        <div class="admin-item-title">${t.name}</div>
        <div class="admin-item-sub">Товаров: ${storeData.products.filter(p => p.typeId === t.id).length}</div>
      </div>
      <div class="admin-item-actions">
        <button class="btn-success" onclick="openAdminProductsModal('${t.id}')">Товары</button>
        <button class="btn-danger" onclick="deleteType('${t.id}', '${catId}')">Удалить</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function promptAddType(catId) {
  const name = prompt('Введите название вида:');
  if (!name) return;
  const image = prompt('Введите URL картинки:', 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400');
  storeData.types.push({ id: 'type_' + Date.now(), categoryId: catId, name, image: image || 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400' });
  saveData();
  openAdminTypesModal(catId);
  showToast('Вид добавлен');
}

function deleteType(id, catId) {
  if (!confirm('Удалить вид?')) return;
  storeData.types = storeData.types.filter(t => t.id !== id);
  storeData.products = storeData.products.filter(p => p.typeId !== id);
  saveData();
  openAdminTypesModal(catId);
  showToast('Вид удален');
}

function openAdminProductsModal(typeId) {
  const type = storeData.types.find(t => t.id === typeId);
  const container = document.getElementById('modalContent');
  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <button class="header-btn" onclick="openAdminTypesModal('${type.categoryId}')">< Назад</button>
      <div class="modal-title" style="margin:0;">Товары: ${type.name}</div>
    </div>
    <div id="adminProdList"></div>
    <button class="btn-primary" style="width:100%;margin-top:16px;" onclick="promptAddProduct('${typeId}')">+ Добавить товар</button>
  `;
  const list = document.getElementById('adminProdList');
  storeData.products.filter(p => p.typeId === typeId).forEach(p => {
    const div = document.createElement('div');
    div.className = 'admin-item';
    div.innerHTML = `
      <img src="${p.image}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1534067783941-51c97027f385?w=300'">
      <div class="admin-item-info">
        <div class="admin-item-title">${p.name}</div>
        <div class="admin-item-sub">${p.price} Br</div>
      </div>
      <div class="admin-item-actions">
        <button class="btn-danger" onclick="deleteProductItem('${p.id}', '${typeId}')">Удалить</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function promptAddProduct(typeId) {
  const name = prompt('Введите название товара (разновидности):');
  if (!name) return;
  const price = parseFloat(prompt('Введите цену (Br):', '15')) || 15;
  const description = prompt('Введите описание товара:', '');
  const image = prompt('Введите URL картинки:', 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400');
  storeData.products.push({ id: 'prod_' + Date.now(), typeId, name, price, description, image: image || 'https://images.unsplash.com/photo-1534067783941-51c97027f385?w=400' });
  saveData();
  openAdminProductsModal(typeId);
  showToast('Товар добавлен');
}

function deleteProductItem(id, typeId) {
  if (!confirm('Удалить товар?')) return;
  storeData.products = storeData.products.filter(p => p.id !== id);
  saveData();
  openAdminProductsModal(typeId);
  showToast('Товар удален');
}

function openAdminOrders() {
  const container = document.getElementById('modalContent');
  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <button class="header-btn" onclick="openAdmin()">< Назад</button>
      <div class="modal-title" style="margin:0;">Заказы (${state.orders.length})</div>
    </div>
    <div id="adminOrdersList"></div>
  `;
  const list = document.getElementById('adminOrdersList');
  if (state.orders.length === 0) {
    list.innerHTML = `<div class="empty"><p>Нет новых заказов</p></div>`;
    return;
  }
  state.orders.slice().reverse().forEach(ord => {
    const div = document.createElement('div');
    div.className = 'admin-item';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'flex-start';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-width;width:100%;font-weight:600;margin-bottom:4px;">
        <span>Заказ от ${ord.name}</span>
        <span style="color:var(--accent);">${ord.total} Br</span>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;">
        📞 Тел: ${ord.phone}<br>
        📍 Адрес: ${ord.address || 'Самовывоз'}<br>
        👤 Пользователь: ${ord.username}<br>
        🕒 Время: ${ord.date}
      </div>
    `;
    list.appendChild(div);
  });
}

// Init
loadData();
render();
</script>
</body>
</html>
