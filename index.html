<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VELIX — Магазин</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap');
:root {
  --bg: #050505;
  --card: rgba(17, 24, 17, 0.88);
  --card2: #1a221a;
  --green: #00ff41;
  --green2: #00cc33;
  --green-dim: rgba(0,255,65,0.15);
  --text: #e8ffe8;
  --text2: #a0c0a0;
  --text3: #607060;
  --danger: #ff3333;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:'Roboto',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

/* Фон с вашими картинками-коллажами */
body::before {
  content:"";
  position:fixed; inset:0;
  background-image: 
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
    url('https://images.unsplash.com/photo-1550684376-efcbd6e3f031?w=800&q=80'),
    url('https://images.unsplash.com/photo-1629196914375-f7e48f477b6d?w=800&q=80');
  background-size: cover;
  background-position: center;
  background-blend-mode: overlay;
  pointer-events:none; z-index:0;
}

.app { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; }
.header {
  padding:12px 16px 8px;
  display:flex; align-items:center; justify-content:space-between;
  background: rgba(5,5,5,0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,255,65,0.2);
}
.header .logo { font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; letter-spacing:2px; color:var(--green); text-shadow:0 0 10px rgba(0,255,65,0.4); }
.header .manage-btn {
  display:none;
  font-size:13px; color:var(--green); border:1px solid var(--green);
  background:rgba(0,255,65,0.15); padding:6px 12px; border-radius:8px;
  font-family:'Roboto',sans-serif; cursor:pointer; font-weight:500;
}
.page { flex:1; overflow-y:auto; padding:12px 16px 100px; display:none; }
.page.active { display:block; }
.page::-webkit-scrollbar { width:0; }

.search-bar { display:flex; gap:8px; margin-bottom:16px; }
.search-bar input {
  flex:1; background:var(--card); border:1px solid rgba(0,255,65,0.3); border-radius:12px;
  padding:12px 16px; color:var(--text); font-size:15px; outline:none;
  backdrop-filter: blur(5px);
}
.search-bar input::placeholder { color:var(--text3); }

.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.cat-card {
  background:var(--card); border:1px solid rgba(0,255,65,0.25); border-radius:16px;
  overflow:hidden; position:relative; cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,0.6); backdrop-filter: blur(6px);
  transition:transform 0.2s, border-color 0.2s;
}
.cat-card:active { transform:scale(0.97); }
.cat-card:hover { border-color:var(--green); }
.cat-card .img-wrap { width:100%; aspect-ratio:1; overflow:hidden; position:relative; background:#0f1f0f; }
.cat-card img { width:100%; height:100%; object-fit:cover; }
.cat-card .cat-name {
  padding:10px; font-size:14px; font-weight:500; text-align:center;
  color:var(--text); background: rgba(0,0,0,0.75);
}

.prod-card {
  background:var(--card); border:1px solid rgba(0,255,65,0.25); border-radius:16px;
  overflow:hidden; cursor:pointer; backdrop-filter: blur(6px); transition:transform 0.2s;
}
.prod-card:active { transform:scale(0.97); }
.prod-card .img-wrap { width:100%; aspect-ratio:1; background:#0a0f0a; position:relative; }
.prod-card img { width:100%; height:100%; object-fit:cover; }
.prod-card .info { padding:10px; }
.prod-card .name { font-size:14px; font-weight:500; margin-bottom:8px; line-height: 1.2; }
.prod-card .bot { display:flex; align-items:center; justify-content:space-between; }
.prod-card .price { font-size:16px; font-weight:700; color:var(--green); }
.prod-card .actions { display:flex; gap:8px; }
.prod-card .btn-icon {
  width:36px; height:36px; border-radius:10px; border:1px solid rgba(0,255,65,0.3);
  background:var(--card2); color:var(--green); display:flex; align-items:center; justify-content:center;
  font-size:16px; cursor:pointer;
}

.sec-title { font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; margin:16px 0 12px; letter-spacing:1px; color:var(--green); text-shadow:0 0 8px rgba(0,255,65,0.3); }
.bread { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:var(--text2); flex-wrap:wrap; }
.bread span { cursor:pointer; }
.bread span.active { color:var(--green); }

/* Страница товара с выбором количества */
.pdetail { background: var(--card); border: 1px solid rgba(0,255,65,0.3); border-radius: 16px; padding: 16px; backdrop-filter: blur(8px); }
.pdetail .img-big { width:100%; aspect-ratio:1; border-radius:12px; overflow:hidden; background:#0a0f0a; margin-bottom:16px; }
.pdetail .img-big img { width:100%; height:100%; object-fit:cover; }
.pdetail h1 { font-size:20px; font-weight:700; margin-bottom:8px; }
.pdetail .sub { color:var(--text2); margin-bottom:16px; font-size: 14px; line-height: 1.4; }
.pdetail .price-val { font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; color:var(--green); margin-bottom:16px; }

/* Управление количеством на детальной странице */
.qty-selector { display:flex; align-items:center; gap:16px; margin-bottom:20px; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 12px; width: fit-content; border: 1px solid rgba(0,255,65,0.2); }
.qty-selector button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--green); background: var(--card2); color: var(--green); font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qty-selector span { font-size: 18px; font-weight: 700; min-width: 24px; text-align: center; }

.pbot {
  position:fixed; bottom:70px; left:0; right:0; padding:12px 16px;
  background: linear-gradient(0deg, rgba(5,5,5,0.98) 0%, transparent 100%);
  display:flex; gap:12px; align-items:center; z-index:50; max-width: 480px; margin: 0 auto;
}
.pbot .add-btn {
  flex:1; background:var(--green); color:#000; border:none; border-radius:14px;
  padding:14px; font-size:16px; font-weight:700; cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,65,0.4); text-transform: uppercase;
}

/* Корзина */
.cart-item {
  display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px;
  padding:12px; margin-bottom:12px; border:1px solid rgba(0,255,65,0.25); backdrop-filter: blur(6px);
}
.cart-item img { width:64px; height:64px; border-radius:10px; object-fit:cover; }
.cart-item .ci-info { flex:1; }
.cart-item .ci-name { font-size:15px; font-weight:500; margin-bottom:4px; }
.cart-item .ci-price { color:var(--text2); font-size:13px; }
.cart-item .ci-qty { display:flex; align-items:center; gap:12px; margin-top:8px; }
.cart-item .ci-qty button {
  width:30px; height:30px; border-radius:8px; border:1px solid rgba(0,255,65,0.3); background:var(--card2);
  color:var(--green); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.cart-item .ci-total { text-align:right; margin-left:8px; }
.cart-item .ci-total .sum { font-size:16px; font-weight:700; color:var(--green); }
.cart-item .del { color:var(--danger); font-size:20px; margin-left:8px; cursor:pointer; }
.cart-summary {
  background:var(--card); border-radius:16px; padding:16px; margin-top:8px; border:1px solid rgba(0,255,65,0.25); backdrop-filter: blur(6px);
}
.cart-summary .row { display:flex; justify-content:space-between; margin-bottom:10px; font-size:15px; }
.cart-summary .row.total { font-size:18px; font-weight:700; margin-top:8px; padding-top:8px; border-top:1px dashed #333; }
.cart-summary .row.total span:last-child { color: var(--green); }
.cart-summary .checkout {
  width:100%; margin-top:12px; background:var(--green); color:#000; border:none;
  border-radius:14px; padding:16px; font-size:17px; font-weight:700; cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,65,0.3); text-transform: uppercase;
}

/* Оформление заказа (только самовывоз + адрес) */
.order-form .field {
  background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:12px;
  border:1px solid rgba(0,255,65,0.25); display:flex; align-items:center; gap:12px; backdrop-filter: blur(6px);
}
.order-form .field .icon { font-size:20px; width:24px; text-align:center; }
.order-form .field input, .order-form .field textarea {
  flex:1; background:transparent; border:none; color:var(--text); font-size:15px; outline:none; font-family:inherit;
}
.order-form .field input::placeholder, .order-form .field textarea::placeholder { color:var(--text3); }
.order-form .submit {
  width:100%; background:var(--green); color:#000; border:none; border-radius:14px;
  padding:16px; font-size:17px; font-weight:700; margin-top:8px; cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,65,0.3); text-transform: uppercase;
}
.pickup-info { background: rgba(0,255,65,0.1); border: 1px solid var(--green); border-radius: 12px; padding: 12px; margin-bottom: 16px; font-size: 14px; line-height: 1.4; color: var(--text); }

/* Админ-панель */
.admin-list .item {
  display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px;
  padding:12px; margin-bottom:10px; border:1px solid rgba(0,255,65,0.3); cursor:pointer; backdrop-filter: blur(6px);
}
.admin-list .item img { width:48px; height:48px; border-radius:10px; object-fit:cover; }
.admin-list .item .name { flex:1; font-size:15px; }
.admin-list .item .del {
  background:var(--danger); color:#fff; border:none; border-radius:8px;
  padding:8px 14px; font-size:13px; cursor:pointer; font-weight: 600;
}
.admin-list .add-btn {
  width:100%; background:var(--green); color:#000; border:none; border-radius:14px;
  padding:16px; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px;
  box-shadow:0 0 20px rgba(0,255,65,0.3); text-transform: uppercase;
}
.admin-modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:200;
  display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(8px);
}
.admin-modal.active { display:flex; }
.admin-modal .box {
  background:#111b11; border:1px solid rgba(0,255,65,0.4); border-radius:20px;
  padding:24px; width:100%; max-width:400px; box-shadow: 0 0 30px rgba(0,255,65,0.2);
}
.admin-modal .box h3 { margin-bottom:16px; font-size:18px; color: var(--green); font-family: 'Oswald', sans-serif; }
.admin-modal .box input, .admin-modal .box textarea {
  width:100%; background:var(--bg); border:1px solid rgba(0,255,65,0.3); border-radius:12px;
  padding:14px; color:var(--text); font-size:15px; margin-bottom:12px; outline:none; font-family:inherit;
}
.admin-modal .box .img-preview { width:100%; height:140px; background:var(--bg); border: 1px dashed rgba(0,255,65,0.3); border-radius:12px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; color:var(--text3); overflow:hidden; }
.admin-modal .box .img-preview img { width:100%; height:100%; object-fit:cover; }
.admin-modal .box .btns { display:flex; gap:10px; }
.admin-modal .box .btns button { flex:1; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; }
.admin-modal .box .btns .save { background:var(--green); color:#000; }
.admin-modal .box .btns .cancel { background:#333; color:var(--text); }

.empty-state { text-align:center; padding:60px 20px; color:var(--text3); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

.profile-card { background:var(--card); border-radius:16px; padding:20px; text-align:center; border:1px solid rgba(0,255,65,0.3); backdrop-filter: blur(6px); }
.profile-card .avatar { width:80px; height:80px; border-radius:50%; background:var(--green-dim); margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--green); border:2px solid var(--green); }
.profile-card .uname { font-size:18px; font-weight:700; margin-bottom:4px; }
.profile-card .role { font-size:13px; color:var(--green); margin-bottom:12px; font-weight: 500; }
.profile-card .address-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(0,255,65,0.3); text-align: left; }
.profile-card .address-box label { font-size: 11px; text-transform: uppercase; color: var(--text3); display: block; margin-bottom: 4px; }
.profile-card .address-box input { width: 100%; background: var(--bg); border: 1px solid rgba(0,255,65,0.3); border-radius: 8px; padding: 10px; color: var(--text); font-size: 14px; outline: none; }

.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; max-width: 480px; margin: 0 auto;
  background: rgba(5,5,5,0.95); backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,255,65,0.2); display:flex; justify-content:space-around;
  padding:8px 0 20px; z-index:100;
}
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text3); font-size:11px; cursor:pointer; border:none; background:none; flex:1; position:relative; }
.nav-item .icon { font-size:22px; }
.nav-item.active { color:var(--green); text-shadow: 0 0 10px rgba(0,255,65,0.5); }
.nav-item .badge { position:absolute; top:2px; margin-left:16px; background:var(--danger); color:#fff; font-size:10px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px);
  background:var(--card2); border:1px solid var(--green); color:var(--green);
  padding:12px 24px; border-radius:12px; font-size:14px; z-index:300;
  transition:transform 0.3s; pointer-events:none; box-shadow: 0 0 15px rgba(0,255,65,0.3);
}
.toast.show { transform:translateX(-50%) translateY(0); }
.back-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--green); font-size:15px; cursor:pointer; }
.hide { display:none !important; }
.app-container { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app-container">
<div class="app">
<!-- Header -->
<div class="header">
  <div class="logo">VELIX</div>
  <button class="manage-btn" id="manageBtn" onclick="openAdmin()">⚙ Управление</button>
</div>

<!-- Page: Catalog -->
<div class="page active" id="page-catalog">
  <div class="search-bar">
    <input type="text" placeholder="Найти..." id="catalogSearch" oninput="renderCatalog()">
  </div>
  <div class="sec-title">Каталог</div>
  <div class="grid2" id="catalogGrid"></div>
</div>

<!-- Page: Types -->
<div class="page" id="page-types">
  <div class="back-bar" onclick="goCatalog()"><span>←</span> Назад</div>
  <div class="bread" id="typeBread"></div>
  <div class="sec-title" id="typeTitle"></div>
  <div class="grid2" id="typesGrid"></div>
</div>

<!-- Page: Products -->
<div class="page" id="page-products">
  <div class="back-bar" onclick="goTypes()"><span>←</span> Назад</div>
  <div class="bread" id="prodBread"></div>
  <div class="sec-title" id="prodTitle"></div>
  <div class="grid2" id="productsGrid"></div>
</div>

<!-- Page: Product Detail -->
<div class="page" id="page-detail">
  <div class="back-bar" onclick="goBackFromDetail()"><span>←</span> Назад</div>
  <div class="pdetail" id="detailContent"></div>
  <div style="height:140px"></div>
</div>

<!-- Page: Search -->
<div class="page" id="page-search">
  <div class="search-bar">
    <input type="text" placeholder="Найти..." id="globalSearch" oninput="doSearch()">
  </div>
  <div class="sec-title">Результаты</div>
  <div class="grid2" id="searchGrid"></div>
</div>

<!-- Page: Cart -->
<div class="page" id="page-cart">
  <div class="sec-title">Корзина</div>
  <div id="cartItems"></div>
  <div class="cart-summary" id="cartSummary"></div>
</div>

<!-- Page: Order (Самовывоз) -->
<div class="page" id="page-order">
  <div class="back-bar" onclick="showPage('cart')"><span>←</span> Назад</div>
  <div class="sec-title">Оформление заказа</div>
  <div class="order-form">
    <div class="pickup-info" id="pickupAddressText">📍 <b>Пункт самовывоза:</b> Загрузка адреса...</div>
    <div class="field"><span class="icon">👤</span><input type="text" id="oName" placeholder="Имя" oninput="checkOrder()"></div>
    <div class="field"><span class="icon">📞</span><input type="tel" id="oPhone" placeholder="Телефон" oninput="checkOrder()"></div>
    <div class="field"><span class="icon">💬</span><textarea id="oComment" placeholder="Комментарий к заказу"></textarea></div>
    <div class="field"><span class="icon">✈️</span><input type="text" id="oTg" placeholder="Ник в Telegram (@username)" oninput="checkOrder()"></div>
    <button class="submit" id="oSubmit" onclick="placeOrder()">Подтвердить заказ 🔒</button>
  </div>
</div>

<!-- Page: Favorites -->
<div class="page" id="page-fav">
  <div class="sec-title">Избранное</div>
  <div id="favContent"></div>
</div>

<!-- Page: Profile -->
<div class="page" id="page-profile">
  <div class="sec-title">Профиль</div>
  <div class="profile-card">
    <div class="avatar">👤</div>
    <div class="uname" id="pName">Гость</div>
    <div class="role" id="pRole">Покупатель</div>
    <div class="address-box" id="adminAddressEditor" style="display:none;">
      <label>Адрес самовывоза (изменяем для всех):</label>
      <input type="text" id="pickupInput" placeholder="Введите адрес..." onchange="updatePickupAddress(this.value)">
    </div>
  </div>
  <div class="profile-menu" style="margin-top:16px;">
    <div class="mi" style="display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;border:1px solid rgba(0,255,65,0.25);" onclick="showToast('Раздел в разработке')"><span style="font-size:20px">📦</span><span style="flex:1">Мои заказы</span><span style="color:var(--text3)">›</span></div>
    <div class="mi" style="display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;border:1px solid rgba(0,255,65,0.25);" onclick="showToast('Раздел в разработке')"><span style="font-size:20px">❓</span><span style="flex:1">Помощь</span><span style="color:var(--text3)">›</span></div>
  </div>
</div>

<!-- Page: Admin -->
<div class="page" id="page-admin">
  <div class="back-bar" onclick="goCatalog()"><span>←</span> Назад</div>
  <div class="sec-title" id="adminTitle">Управление каталогом</div>
  <div class="admin-list" id="adminList"></div>
</div>

<!-- Admin Modal -->
<div class="admin-modal" id="adminModal">
  <div class="box">
    <h3 id="modalTitle">Добавить</h3>
    <input type="text" id="mName" placeholder="Название">
    <input type="text" id="mImg" placeholder="URL фотографии" oninput="previewImg()">
    <div class="img-preview" id="mPreview">Фото</div>
    <textarea id="mDesc" placeholder="Описание (для товара)" class="hide"></textarea>
    <input type="number" id="mPrice" placeholder="Цена (Br)" class="hide">
    <div class="btns">
      <button class="save" onclick="saveModal()">Сохранить</button>
      <button class="cancel" onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="setTab('catalog',this)">
    <span class="icon">⊞</span>
    <span>Каталог</span>
  </button>
  <button class="nav-item" onclick="setTab('search',this)">
    <span class="icon">⌕</span>
    <span>Найти</span>
  </button>
  <button class="nav-item" onclick="setTab('cart',this)">
    <span class="icon">🛒</span>
    <span>Корзина</span>
    <span class="badge hide" id="cartBadge">0</span>
  </button>
  <button class="nav-item" onclick="setTab('fav',this)">
    <span class="icon">♡</span>
    <span>Избранное</span>
  </button>
  <button class="nav-item" onclick="setTab('profile',this)">
    <span class="icon">👤</span>
    <span>Профиль</span>
  </button>
</div>
<!-- Toast -->
<div class="toast" id="toast"></div>
</div>
</div>

<script>
// ================= НАСТРОЙКА SUPABASE =================
const SUPABASE_URL = 'https://wsectwqifvupdnzxdbrq.supabase.co';
const SUPABASE_KEY = 'ВАШ_ANON_KEY_СЮДА'; // Обязательно вставьте ваш актуальный publishable/anon ключ Supabase
const MAKE_WEBHOOK_URL = ''; // Опционально: вебхук для заказов в Telegram

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_USERS = ["@beerezka0", "@mokiner"];
let data = { categories: [], types: [], products: [], pickupAddress: "г. Минск, ул. Притыцкого 15 (Пункт выдачи VELIX)" };
let cart = JSON.parse(localStorage.getItem('velix_cart')) || [];
let fav = JSON.parse(localStorage.getItem('velix_fav')) || [];
let currentUser = "";
let navStack = [];
let adminCtx = {mode:'cats', catId:null, typeId:null};
let modalCtx = {};
let currentQty = 1;

const tg = window.Telegram?.WebApp;
if(tg) { tg.expand(); tg.enableClosingConfirmation(); }

async function initStore() {
  let tgUser = tg?.initDataUnsafe?.user;
  if(tgUser && tgUser.username) {
    currentUser = '@' + tgUser.username.trim().toLowerCase();
  } else {
    currentUser = localStorage.getItem('velix_user') || "";
    if(!currentUser){
      let u = prompt('Введите ваш Telegram @username (например @user):') || "";
      currentUser = u.startsWith('@') ? u.toLowerCase() : '@'+u.toLowerCase();
      localStorage.setItem('velix_user', currentUser);
    }
  }

  document.getElementById('pName').textContent = currentUser;
  if(isAdmin()){
    document.getElementById('manageBtn').style.display='block';
    document.getElementById('pRole').textContent = 'Администратор';
    document.getElementById('adminAddressEditor').style.display='block';
  }

  await loadDataFromSupabase();
  renderCatalog();
  updateBadge();
}

function isAdmin(){ return ADMIN_USERS.includes(currentUser.toLowerCase()); }

async function loadDataFromSupabase() {
  try {
    let { data: res, error } = await supabaseClient
      .from('store_data')
      .select('*')
      .eq('id', 'main_catalog')
      .single();

    if(res && res.data) {
      data = res.data;
      if(!data.pickupAddress) data.pickupAddress = "г. Минск, ул. Притыцкого 15 (Пункт выдачи VELIX)";
    } else {
      data = {
        categories: [
          {id:1, name:"Никобустеры", img:"https://images.unsplash.com/photo-1629196914375-f7e48f477b6d?w=400&q=80"},
          {id:2, name:"POD - системы", img:"https://images.unsplash.com/photo-1523390218841-1040c4a5b0f2?w=400&q=80"},
          {id:3, name:"Жевательные смеси", img:"https://images.unsplash.com/photo-1582058091505-f87a2e55a40f?w=400&q=80"}
        ],
        types: [
          {id:1, catId:3, name:"FAFF", img:"https://images.unsplash.com/photo-1582058091505-f87a2e55a40f?w=400&q=80"}
        ],
        products: [
          {id:1, typeId:1, name:"FAFF Supercharged", desc:"Крепкая жевательная смесь.", price:14, img:"https://images.unsplash.com/photo-1582058091505-f87a2e55a40f?w=400&q=80", opts:["Kiwi Burn","Ice Cola"]}
        ],
        pickupAddress: "г. Минск, ул. Притыцкого 15 (Пункт выдачи VELIX)"
      };
      await supabaseClient.from('store_data').upsert({ id: 'main_catalog', data: data });
    }
  } catch(e) {
    console.error("Supabase load error:", e);
  }

  // Realtime подписка
  supabaseClient
    .channel('public:store_data')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'store_data' }, payload => {
      if(payload.new && payload.new.data) {
        data = payload.new.data;
        if(!data.pickupAddress) data.pickupAddress = "г. Минск, ул. Притыцкого 15 (Пункт выдачи VELIX)";
        renderCatalog();
        updatePickupUI();
      }
    })
    .subscribe();
}

async function saveData(){ 
  try {
    await supabaseClient.from('store_data').upsert({ id: 'main_catalog', data: data });
  } catch(e) {
    showToast('Ошибка сохранения в облако');
  }
}

function updatePickupUI() {
  let addrBox = document.getElementById('pickupAddressText');
  if(addrBox) {
    addrBox.innerHTML = `📍 <b>Пункт самовывоза:</b> ${data.pickupAddress}`;
  }
  let pInput = document.getElementById('pickupInput');
  if(pInput && isAdmin()) {
    pInput.value = data.pickupAddress;
  }
}

async function updatePickupAddress(newAddr) {
  if(!isAdmin()) return;
  data.pickupAddress = newAddr;
  await saveData();
  updatePickupUI();
  showToast('Адрес самовывоза обновлен');
}

function saveCart(){ localStorage.setItem('velix_cart', JSON.stringify(cart)); updateBadge(); }
function saveFav(){ localStorage.setItem('velix_fav', JSON.stringify(fav)); }

// ================= НАВИГАЦИЯ =================
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(id==='catalog') renderCatalog();
  if(id==='cart') renderCart();
  if(id==='fav') renderFav();
  if(id==='profile') updatePickupUI();
  if(id==='order') updatePickupUI();
}
function setTab(tab,el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if(tab==='search') showPage('search');
  else if(tab==='catalog') goCatalog();
  else showPage(tab);
}
function goHome(){ goCatalog(); }
function goCatalog(){ navStack=[]; showPage('catalog'); renderCatalog(); }
function goTypes(){ navStack.pop(); showPage('types'); renderTypes(adminCtx.catId); }
function goBackFromDetail(){
  if(navStack.length>0){ let p=navStack.pop(); showPage(p.page); }
  else goCatalog();
}

// ================= КАТАЛОГ =================
function renderCatalog(){
  let q = document.getElementById('catalogSearch').value.toLowerCase();
  let grid = document.getElementById('catalogGrid');
  grid.innerHTML = '';
  data.categories.forEach(c=>{
    if(q && !c.name.toLowerCase().includes(q)) return;
    let el = document.createElement('div');
    el.className='cat-card';
    el.innerHTML = `<div class="img-wrap"><img src="${c.img}" onerror="this.src='https://via.placeholder.com/300/111/00ff41?text=NO+IMG'"></div><div class="cat-name">${c.name}</div>`;
    el.onclick = ()=>{ adminCtx.catId=c.id; navStack.push({page:'catalog'}); renderTypes(c.id); };
    grid.appendChild(el);
  });
}

function renderTypes(catId){
  let cat = data.categories.find(c=>c.id===catId);
  if(!cat) return;
  document.getElementById('typeTitle').textContent = cat.name;
  document.getElementById('typeBread').innerHTML = `<span onclick="goCatalog()">Каталог</span> <span>›</span> <span class="active">${cat.name}</span>`;
  let grid = document.getElementById('typesGrid');
  grid.innerHTML = '';
  let items = data.types.filter(t=>t.catId===catId);
  if(items.length===0) grid.innerHTML = '<div style="grid-column:1/-1;color:var(--text3);text-align:center;padding:40px;">Нет видов</div>';
  items.forEach(t=>{
    let el = document.createElement('div');
    el.className='cat-card';
    el.innerHTML = `<div class="img-wrap"><img src="${t.img}" onerror="this.src='https://via.placeholder.com/300/111/00ff41?text=NO+IMG'"></div><div class="cat-name">${t.name}</div>`;
    el.onclick = ()=>{ adminCtx.typeId=t.id; navStack.push({page:'types'}); renderProducts(t.id); };
    grid.appendChild(el);
  });
  showPage('types');
}

function renderProducts(typeId){
  let type = data.types.find(t=>t.id===typeId);
  let cat = data.categories.find(c=>c.id===type.catId);
  document.getElementById('prodTitle').textContent = type.name;
  document.getElementById('prodBread').innerHTML = `<span onclick="goCatalog()">Каталог</span> <span>›</span> <span onclick="goTypes()">${cat.name}</span> <span>›</span> <span class="active">${type.name}</span>`;
  let grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  let items = data.products.filter(p=>p.typeId===typeId);
  if(items.length===0) grid.innerHTML = '<div style="grid-column:1/-1;color:var(--text3);text-align:center;padding:40px;">Нет товаров</div>';
  items.forEach(p=>{
    let el = document.createElement('div');
    el.className='prod-card';
    el.innerHTML = `
      <div class="img-wrap"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300/111/00ff41?text=NO+IMG'"></div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="bot">
          <div class="actions">
            <button class="btn-icon" onclick="event.stopPropagation();addToCartQuick(${p.id})">🛒</button>
            <button class="btn-icon" onclick="event.stopPropagation();toggleFav(${p.id})">${fav.includes(p.id)?'♥':'♡'}</button>
          </div>
          <div class="price">${p.price} Br</div>
        </div>
      </div>`;
    el.onclick = ()=> openProduct(p.id);
    grid.appendChild(el);
  });
  showPage('products');
}

// ================= ДЕТАЛИ ТОВАРА + КОЛИЧЕСТВО =================
function openProduct(pid){
  let p = data.products.find(x=>x.id===pid); if(!p) return;
  let type = data.types.find(t=>t.id===p.typeId);
  currentQty = 1;
  document.getElementById('detailContent').innerHTML = `
    <div class="img-big"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300/111/00ff41?text=NO+IMG'"></div>
    <h1>${p.name}</h1>
    <div class="sub">${p.desc || ''}</div>
    <div class="price-val" id="detailPrice">${p.price} Br</div>
    <div class="qty-selector">
      <button onclick="changeDetailQty(-1)">-</button>
      <span id="detailQtyVal">1</span>
      <button onclick="changeDetailQty(1)">+</button>
    </div>
  `;
  navStack.push({page:'products'});
  showPage('detail');
  
  let pb=document.querySelector('.pbot'); if(pb) pb.remove();
  let bar=document.createElement('div'); bar.className='pbot';
  bar.innerHTML=`<button class="add-btn" onclick="addDetailToCart(${p.id})">В корзину</button>`;
  document.body.appendChild(bar);
}

function changeDetailQty(d) {
  currentQty += d;
  if(currentQty < 1) currentQty = 1;
  document.getElementById('detailQtyVal').textContent = currentQty;
}

function addDetailToCart(pid) {
  let ex = cart.find(c=>c.id===pid);
  if(ex) ex.qty += currentQty; 
  else cart.push({id:pid, qty:currentQty});
  saveCart(); 
  showToast('Добавлено в корзину');
}

function addToCartQuick(pid) {
  let ex = cart.find(c=>c.id===pid);
  if(ex) ex.qty++; else cart.push({id:pid, qty:1});
  saveCart(); 
  showToast('Добавлено в корзину');
}

// ================= КОРЗИНА =================
function renderCart(){
  let box=document.getElementById('cartItems');
  let sumBox=document.getElementById('cartSummary');
  if(cart.length===0){ box.innerHTML='<div class="empty-state"><div class="icon">🛒</div>Корзина пуста</div>'; sumBox.classList.add('hide'); return; }
  sumBox.classList.remove('hide');
  box.innerHTML='';
  let total=0;
  cart.forEach(c=>{
    let p=data.products.find(x=>x.id===c.id); if(!p) return;
    total+=p.price*c.qty;
    let el=document.createElement('div'); el.className='cart-item';
    el.innerHTML=`<img src="${p.img}"><div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-price">${p.price} Br/шт</div><div class="ci-qty"><button onclick="chgQty(${c.id},-1)">−</button><span>${c.qty}</span><button onclick="chgQty(${c.id},1)">+</button></div></div><div class="ci-total"><div class="sum">${p.price*c.qty} Br</div></div><div class="del" onclick="remCart(${c.id})">🗑</div>`;
    box.appendChild(el);
  });
  sumBox.innerHTML=`<div class="row"><span>Итого</span><span>${total} Br</span></div><button class="checkout" onclick="showPage('order')">Оформить заказ (Самовывоз)</button>`;
}

function chgQty(id,d){ 
  let c=cart.find(x=>x.id===id); if(!c) return; 
  c.qty+=d; 
  if(c.qty<=0) remCart(id); 
  else saveCart(); 
  renderCart(); 
}

function remCart(id){ cart=cart.filter(c=>c.id!==id); saveCart(); renderCart(); }
function updateBadge(){ let n=cart.reduce((s,i)=>s+i.qty,0); let b=document.getElementById('cartBadge'); b.textContent=n; b.classList.toggle('hide',n===0); }

// ================= ЗАКАЗЫ (САМОВЫВОЗ) =================
function checkOrder(){
  let ok = document.getElementById('oName').value && document.getElementById('oPhone').value && document.getElementById('oTg').value;
  document.getElementById('oSubmit').classList.toggle('active', !!ok);
}

async function placeOrder(){
  let name = document.getElementById('oName').value;
  let phone = document.getElementById('oPhone').value;
  let tgNick = document.getElementById('oTg').value;
  if(!name || !phone || !tgNick) { showToast('Заполните обязательные поля'); return; }

  let orderDetails = {
    name: name,
    phone: phone,
    address: data.pickupAddress,
    comment: document.getElementById('oComment').value,
    telegram: tgNick,
    items: cart,
    total: cart.reduce((sum, item)=>{
      let p = data.products.find(x=>x.id===item.id);
      return sum + (p ? p.price * item.qty : 0);
    }, 0),
    date: new Date().toLocaleString()
  };

  try {
    await supabaseClient.from('store_orders').insert([{ data: orderDetails }]);
  } catch(e) {
    console.error("Order save error:", e);
  }

  if(MAKE_WEBHOOK_URL) {
    try {
      fetch(MAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(orderDetails)
      });
    } catch(e){}
  }

  cart=[]; saveCart(); showToast('Заказ успешно оформлен!'); goCatalog();
}

// ================= ИЗБРАННОЕ =================
function toggleFav(pid){ 
  let i=fav.indexOf(pid); 
  if(i>-1) fav.splice(i,1); 
  else fav.push(pid); 
  saveFav(); 
  showToast(i>-1?'Удалено из избранного':'Добавлено в избранное'); 
  renderFav(); 
}

function renderFav(){
  let box=document.getElementById('favContent');
  if(fav.length===0){ box.innerHTML='<div class="empty-state"><div class="icon">♡</div>Список избранного пуст</div>'; return; }
  box.innerHTML='<div class="grid2" id="favGrid"></div>';
  let g=document.getElementById('favGrid');
  fav.forEach(fid=>{
    let p=data.products.find(x=>x.id===fid); if(!p) return;
    let el=document.createElement('div'); el.className='prod-card';
    el.innerHTML=`<div class="img-wrap"><img src="${p.img}"></div><div class="info"><div class="name">${p.name}</div><div class="bot"><div class="actions"><button class="btn-icon" onclick="event.stopPropagation();addToCartQuick(${p.id})">🛒</button><button class="btn-icon" onclick="event.stopPropagation();toggleFav(${p.id})">♥</button></div><div class="price">${p.price} Br</div></div></div>`;
    el.onclick=()=>openProduct(p.id);
    g.appendChild(el);
  });
}

// ================= ПОИСК =================
function doSearch(){
  let q=document.getElementById('globalSearch').value.toLowerCase();
  let g=document.getElementById('searchGrid'); g.innerHTML='';
  if(!q) return;
  let res=data.products.filter(p=>p.name.toLowerCase().includes(q));
  if(res.length===0){ g.innerHTML='<div style="grid-column:1/-1;color:var(--text3);text-align:center;padding:40px;">Ничего не найдено</div>'; return; }
  res.forEach(p=>{
    let el=document.createElement('div'); el.className='prod-card';
    el.innerHTML=`<div class="img-wrap"><img src="${p.img}"></div><div class="info"><div class="name">${p.name}</div><div class="bot"><div class="actions"><button class="btn-icon" onclick="event.stopPropagation();addToCartQuick(${p.id})">🛒</button><button class="btn-icon" onclick="event.stopPropagation();toggleFav(${p.id})">${fav.includes(p.id)?'♥':'♡'}</button></div><div class="price">${p.price} Br</div></div></div>`;
    el.onclick=()=>openProduct(p.id);
    g.appendChild(el);
  });
}

// ================= АДМИН-ПАНЕЛЬ =================
function openAdmin(){ if(!isAdmin()) return; adminCtx={mode:'cats',catId:null,typeId:null}; renderAdmin(); showPage('admin'); }

function renderAdmin(){
  let list=document.getElementById('adminList'); list.innerHTML='';
  if(adminCtx.mode==='cats'){
    document.getElementById('adminTitle').textContent='Управление категориями';
    data.categories.forEach(c=>{
      let el=document.createElement('div'); el.className='item';
      el.innerHTML=`<img src="${c.img}"><div class="name">${c.name}</div><button class="del" onclick="delCat(${c.id})">Удалить</button>`;
      el.onclick=(e)=>{ if(e.target.tagName==='BUTTON') return; adminCtx={mode:'types',catId:c.id,typeId:null}; renderAdmin(); };
      list.appendChild(el);
    });
    let add=document.createElement('button'); add.className='add-btn'; add.textContent='Добавить категорию'; add.onclick=()=>openModal('cat'); list.appendChild(add);
  } else if(adminCtx.mode==='types'){
    let cat=data.categories.find(c=>c.id===adminCtx.catId);
    document.getElementById('adminTitle').textContent='Виды: '+cat.name;
    let items=data.types.filter(t=>t.catId===adminCtx.catId);
    items.forEach(t=>{
      let el=document.createElement('div'); el.className='item';
      el.innerHTML=`<img src="${t.img}"><div class="name">${t.name}</div><button class="del" onclick="delType(${t.id})">Удалить</button>`;
      el.onclick=(e)=>{ if(e.target.tagName==='BUTTON') return; adminCtx={mode:'prods',catId:adminCtx.catId,typeId:t.id}; renderAdmin(); };
      list.appendChild(el);
    });
    let add=document.createElement('button'); add.className='add-btn'; add.textContent='Добавить вид категории'; add.onclick=()=>openModal('type'); list.appendChild(add);
  } else if(adminCtx.mode==='prods'){
    let type=data.types.find(t=>t.id===adminCtx.typeId);
    document.getElementById('adminTitle').textContent='Товары: '+type.name;
    let items=data.products.filter(p=>p.typeId===adminCtx.typeId);
    items.forEach(p=>{
      let el=document.createElement('div'); el.className='item';
      el.innerHTML=`<img src="${p.img}"><div class="name">${p.name} — ${p.price} Br</div><button class="del" onclick="delProd(${p.id})">Удалить</button>`;
      list.appendChild(el);
    });
    let add=document.createElement('button'); add.className='add-btn'; add.textContent='Добавить товар'; add.onclick=()=>openModal('prod'); list.appendChild(add);
  }
}

async function delCat(id){ if(!confirm('Удалить категорию?')) return; data.categories=data.categories.filter(c=>c.id!==id); data.types=data.types.filter(t=>t.catId!==id); await saveData(); renderAdmin(); renderCatalog(); }
async function delType(id){ if(!confirm('Удалить вид?')) return; data.types=data.types.filter(t=>t.id!==id); await saveData(); renderAdmin(); }
async function delProd(id){ if(!confirm('Удалить товар?')) return; data.products=data.products.filter(p=>p.id!==id); await saveData(); renderAdmin(); }

function openModal(type){
  modalCtx={type};
  let m = document.getElementById('adminModal');
  let title=document.getElementById('modalTitle');
  let price=document.getElementById('mPrice');
  let desc=document.getElementById('mDesc');
  document.getElementById('mName').value='';
  document.getElementById('mImg').value='';
  document.getElementById('mPreview').innerHTML='Фото';
  price.classList.add('hide'); desc.classList.add('hide');
  if(type==='cat') title.textContent='Новая категория';
  if(type==='type') title.textContent='Новый вид';
  if(type==='prod'){ title.textContent='Новый товар'; price.classList.remove('hide'); desc.classList.remove('hide'); }
  m.classList.add('active');
}

function previewImg(){
  let url=document.getElementById('mImg').value;
  let p=document.getElementById('mPreview');
  if(url) p.innerHTML=`<img src="${url}" onerror="this.parentElement.innerHTML='Ошибка загрузки'">`;
  else p.innerHTML='Фото';
}

function closeModal(){ document.getElementById('adminModal').classList.remove('active'); }

async function saveModal(){
  let name=document.getElementById('mName').value.trim();
  let img=document.getElementById('mImg').value.trim() || 'https://via.placeholder.com/300/111/00ff41?text=NO+IMG';
  if(!name){ showToast('Введите название'); return; }
  if(modalCtx.type==='cat'){
    let id=data.categories.length ? Math.max(...data.categories.map(c=>c.id))+1 : 1;
    data.categories.push({id,name,img});
  } else if(modalCtx.type==='type'){
    let id=data.types.length ? Math.max(...data.types.map(t=>t.id))+1 : 1;
    data.types.push({id,catId:adminCtx.catId,name,img});
  } else if(modalCtx.type==='prod'){
    let id=data.products.length ? Math.max(...data.products.map(p=>p.id))+1 : 1;
    let descVal=document.getElementById('mDesc').value.trim() || '';
    let priceVal=parseInt(document.getElementById('mPrice').value)||0;
    data.products.push({id,typeId:adminCtx.typeId,name,desc:descVal,price:priceVal,img,opts:["Стандарт"]});
  }
  await saveData(); closeModal(); renderAdmin(); renderCatalog(); showToast('Успешно сохранено');
}

function showToast(msg){
  let t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

initStore();
</script>
