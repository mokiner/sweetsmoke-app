<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SweetSmoke Borisov</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        :root {
            --green: #00ff41;
            --dark: #0a0a0a;
            --accent: #00ff41;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://i.imgur.com/monsterbg1.jpg');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            background: rgba(10,10,10,0.95);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid var(--green);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 24px; text-shadow: 0 0 15px var(--green); }
        .nav {
            display: flex;
            background: #111;
            padding: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-btn {
            background: #000;
            color: var(--green);
            border: 2px solid var(--green);
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .nav-btn.active { background: var(--green); color: #000; }
        .screen { display: none; padding: 15px; }
        .screen.active { display: block; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .card {
            background: rgba(20,20,20,0.95);
            border: 3px solid #222;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card:hover { border-color: var(--green); transform: scale(1.05); }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; }
        .price { color: var(--green); font-weight: bold; }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            border: 4px solid var(--green);
            padding: 20px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
        }
        button {
            background: #000;
            color: var(--green);
            border: 2px solid var(--green);
            padding: 12px;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
            font-family: inherit;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 3px solid var(--green);
            z-index: 200;
        }
        .admin-panel { background: #1a0000; padding: 15px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">SWEETSMOKE BORISOV</div>
        <div style="font-size:11px;color:#0f0;">UNLEASH THE BEAST</div>
    </div>

    <!-- NAV -->
    <div class="nav">
        <button class="nav-btn active" onclick="switchScreen('catalog')">КАТАЛОГ</button>
        <button class="nav-btn" onclick="switchScreen('search')">ПОИСК</button>
        <button class="nav-btn" onclick="switchScreen('cart')">КОРЗИНА</button>
        <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="switchScreen('admin')">УПРАВЛЕНИЕ</button>
    </div>

    <!-- SCREENS -->
    <div id="catalog" class="screen active">
        <h2>Каталог</h2>
        <div class="grid" id="catalog-grid"></div>
    </div>

    <div id="search" class="screen">
        <input type="text" id="search-input" placeholder="Поиск товара..." style="width:100%;padding:12px;background:#222;border:2px solid #0f0;color:white;" onkeyup="searchProducts()">
        <div class="grid" id="search-grid"></div>
    </div>

    <div id="cart" class="screen">
        <h2>Корзина</h2>
        <div id="cart-items"></div>
        <div id="cart-total" style="font-size:20px;color:var(--green);margin:20px 0;"></div>
        <button onclick="checkout()">ОФОРМИТЬ ЗАКАЗ</button>
    </div>

    <div id="admin" class="screen admin-panel">
        <h2>УПРАВЛЕНИЕ КАТАЛОГОМ</h2>
        <button onclick="addCategory()">+ Новая категория</button>
        <div id="admin-categories"></div>
    </div>

    <!-- MODALS -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="float:right;font-size:30px;cursor:pointer;">×</span>
            <img id="modal-img" style="width:100%;height:250px;object-fit:cover;">
            <h2 id="modal-name"></h2>
            <p id="modal-desc"></p>
            <div id="modal-price" class="price"></div>
            <button onclick="addToCartCurrent()">В КОРЗИНУ</button>
        </div>
    </div>

    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <h2>Оформление заказа</h2>
            <input id="order-name" placeholder="Имя" style="width:100%;padding:10px;margin:5px 0;">
            <input id="order-phone" placeholder="Телефон" style="width:100%;padding:10px;margin:5px 0;">
            <textarea id="order-comment" placeholder="Комментарий" style="width:100%;height:80px;padding:10px;margin:5px 0;"></textarea>
            <button onclick="submitOrder()">ОТПРАВИТЬ ЗАКАЗ</button>
            <button onclick="closeCheckoutModal()" style="background:#400;">Отмена</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button onclick="switchScreen('catalog')">🏠</button>
        <button onclick="switchScreen('search')">🔍</button>
        <button onclick="switchScreen('cart')">🛒 <span id="bottom-cart-count">0</span></button>
    </div>

    <script>
        // ==================== ДАННЫЕ ====================
        let catalogData = {
            categories: [
                {id:1, name:"Жевательные смеси", image:"https://picsum.photos/id/20/300/200"},
                {id:2, name:"POD-системы", image:"https://picsum.photos/id/21/300/200"}
            ],
            products: [
                {id:101, catId:1, name:"Glitch 150mg", price:13, stock:45, image:"https://picsum.photos/id/22/300/200", desc:"Полярная мята"},
                {id:102, catId:1, name:"ZUZA 75mg", price:13, stock:30, image:"https://picsum.photos/id/23/300/200", desc:"Клубника"}
            ]
        };

        let cart = [];
        let currentProduct = null;

        // ==================== ADMIN CHECK ====================
        const admins = ["beerezka0", "mokiner"];
        const user = Telegram.WebApp.initDataUnsafe?.user;
        if (user && admins.includes(user.username)) {
            document.getElementById("admin-nav-btn").style.display = "inline-block";
        }

        // ==================== ФУНКЦИИ ====================
        function switchScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screen).classList.add('active');
            if (screen === 'catalog') renderCatalog();
            if (screen === 'cart') renderCart();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            catalogData.categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="${cat.image}">
                    <div class="card-info">
                        <h3>${cat.name}</h3>
                    </div>
                `;
                div.onclick = () => showCategoryProducts(cat.id);
                grid.appendChild(div);
            });
        }

        function showCategoryProducts(catId) {
            const filtered = catalogData.products.filter(p => p.catId === catId);
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '<button onclick="renderCatalog()">← Назад</button>';
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="${p.image}">
                    <div class="card-info">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price} Br</div>
                    </div>
                `;
                div.onclick = () => showProductModal(p);
                grid.appendChild(div);
            });
        }

        function showProductModal(product) {
            currentProduct = product;
            document.getElementById('modal-img').src = product.image;
            document.getElementById('modal-name').textContent = product.name;
            document.getElementById('modal-desc').textContent = product.desc || '';
            document.getElementById('modal-price').textContent = `${product.price} Br`;
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function addToCartCurrent() {
            if (!currentProduct) return;
            cart.push({...currentProduct});
            updateCartCount();
            closeModal();
            alert("Добавлено в корзину!");
        }

        function updateCartCount() {
            const count = cart.length;
            document.getElementById('bottom-cart-count').textContent = count;
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0;">
                        <div>${item.name} — ${item.price} Br</div>
                        <button onclick="removeFromCart(${index})" style="background:#900;width:auto;padding:5px 10px;">×</button>
                    </div>
                `;
                container.appendChild(div);
                total += item.price;
            });
            document.getElementById('cart-total').textContent = `Итого: ${total} Br`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateCartCount();
        }

        function checkout() {
            if (cart.length === 0) return alert("Корзина пуста");
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        async function submitOrder() {
            const name = document.getElementById('order-name').value;
            const phone = document.getElementById('order-phone').value;
            if (!name || !phone) return alert("Заполните данные!");

            const order = {
                user: user,
                items: cart,
                total: cart.reduce((sum, i) => sum + i.price, 0),
                name, phone,
                comment: document.getElementById('order-comment').value
            };

            Telegram.WebApp.sendData(JSON.stringify(order));
            alert("Заказ отправлен!");
            cart = [];
            updateCartCount();
            closeCheckoutModal();
            switchScreen('catalog');
        }

        function searchProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = catalogData.products.filter(p => 
                p.name.toLowerCase().includes(query)
            );
            // render filtered...
        }

        function addCategory() {
            const name = prompt("Название новой категории:");
            if (name) {
                catalogData.categories.push({
                    id: Date.now(),
                    name: name,
                    image: "https://picsum.photos/id/" + Math.floor(Math.random()*100) + "/300/200"
                });
                renderCatalog();
            }
        }

        // INIT
        window.onload = () => {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            renderCatalog();
            updateCartCount();
        };
    </script>
</body>
</html>
